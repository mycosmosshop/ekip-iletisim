// Akışlı Drive yükleyici: yaz() ile gelen parçaları 8 MB'lık dilimler halinde sırayla gönderir, bitir() bağlantıyı döndürür.
function driveYukleyici(ad, tur, kanal) {
  let gonderilen = 0, tampon = [], tamponBoyut = 0, zincir = Promise.resolve();
  const oturum = betikIstegi({ islem: 'baslat', ad, tur, kanal }).then((j) => j.oturum);
  const yolla = async (dilim, son) => {
    const j = await betikIstegi({ islem: 'parca', oturum: await oturum, bas: gonderilen, veri: await blobBase64(dilim), son, tur });
    gonderilen += dilim.size;
    return j;
  };
  return {
    yaz(blob) {
      tampon.push(blob); tamponBoyut += blob.size;
      while (tamponBoyut >= PARCA) {
        const hepsi = new Blob(tampon), dilim = hepsi.slice(0, PARCA), kalan = hepsi.slice(PARCA);
        tampon = [kalan]; tamponBoyut = kalan.size;
        zincir = zincir.then(() => yolla(dilim, false));
      }
    },
    async bitir() {
      const kalan = new Blob(tampon); tampon = [];
      await zincir;
      return yolla(kalan, true);
    },
    gonderilen: () => gonderilen,
  };
}

async function dosyaGonder(f) {
  if (f.size > DOSYA_SINIR) { $('uyari').textContent = 'Dosya 2 GB sınırını aşıyor.'; return; }
  $('uyari').textContent = f.name + ' yükleniyor…';
  try {
    let j;
    if (f.size <= TEK_PARCA) j = await betikIstegi({ ad: f.name, tur: f.type, veri: await blobBase64(f), kanal: durum.aktif });
    else {
      const y = driveYukleyici(f.name, f.type || 'application/octet-stream', durum.aktif);
      const sayac = setInterval(() => { $('uyari').textContent = `${f.name} yükleniyor… %${Math.floor(y.gonderilen() * 100 / f.size)}`; }, 1000);
      try { y.yaz(f); j = await y.bitir(); } finally { clearInterval(sayac); }
    }
    $('uyari').textContent = '';
    await gonder('📎 ' + f.name, { ad: f.name, url: j.url, boyut: j.boyut });
  } catch (e) { $('uyari').textContent = 'Dosya yüklenemedi: ' + e.message; }
}

// ---------- görüşme kaydı ----------
// Görüşmedeki tüm görüntüler bir tuvalde ızgaraya dizilir, tüm sesler karıştırılır, MediaRecorder kaydeder.
// ERP kullanıcısında kayıt Drive'a parça parça akar; parçalar ayrıca bellekte tutulur ki yükleme bozulursa
// kayıt bilgisayara indirilebilsin (Chrome büyük Blob'ları kendiliğinden diske taşır).
async function kayitBaslat() {
  const c = durum.cagri;
  if (!c || c.kayit || !window.MediaRecorder) return;
  const ctx = sesBaglami(), hedef = ctx.createMediaStreamDestination();
  const tuval = Object.assign(document.createElement('canvas'), { width: 1280, height: 720 }), t = tuval.getContext('2d');
  const k = { parcalar: [], bagli: new Set(), kaynaklar: [], hedef, baslangic: new Date() };
  const sesleriBagla = () => {
    const izler = [[durum.ben.id, gonderilecekSes()], ...[...c.esler].map(([id, es]) => [id, es.akis.getAudioTracks()[0]])];
    for (const [id, iz] of izler) {
      if (!iz || k.bagli.has(iz.id)) continue;
      k.bagli.add(iz.id);
      const s = ctx.createMediaStreamSource(new MediaStream([iz])); s.connect(hedef); k.kaynaklar.push(s);
    }
  };
  const ciz = () => {
    // Açık beyaz tahta da kayda girer (ilk hücre)
    const ogeler = [...$('sahne').querySelectorAll('.tahta canvas, .karo video')];
    t.fillStyle = '#111318'; t.fillRect(0, 0, 1280, 720);
    const sutun = Math.ceil(Math.sqrt(ogeler.length || 1)), satir = Math.ceil((ogeler.length || 1) / sutun);
    const w = 1280 / sutun, h = 720 / satir;
    ogeler.forEach((o, i) => {
      const x = (i % sutun) * w, y = Math.floor(i / sutun) * h;
      const kw = o.videoWidth ?? o.width, kh = o.videoHeight ?? o.height;
      if (kw) {
        const olcek = Math.min(w / kw, h / kh), vw = kw * olcek, vh = kh * olcek;
        t.drawImage(o, x + (w - vw) / 2, y + (h - vh) / 2, vw, vh);
      }
      const ad = o.tagName === 'CANVAS' ? 'Beyaz tahta' : o.closest('.karo').querySelector('span.ad').textContent;
      t.fillStyle = 'rgba(0,0,0,.6)'; t.fillRect(x + 8, y + h - 30, 220, 22);
      t.fillStyle = '#fff'; t.font = '14px Segoe UI, sans-serif'; t.fillText(ad.slice(0, 28), x + 14, y + h - 14);
    });
    sesleriBagla();
  };
  ciz();
  const akis = new MediaStream([tuval.captureStream(25).getVideoTracks()[0], hedef.stream.getAudioTracks()[0]]);
  const tur = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus') ? 'video/webm;codecs=vp8,opus' : 'video/webm';
  k.kaydedici = new MediaRecorder(akis, { mimeType: tur, videoBitsPerSecond: 1_000_000, audioBitsPerSecond: 64_000 });
  k.ad = `Görüşme kaydı ${k.baslangic.toLocaleString('tr-TR').replace(/[/:]/g, '-')}.webm`;
  k.yukleyici = c.erp && !YEREL && DOSYA_URL ? driveYukleyici(k.ad, 'video/webm', durum.aktif) : null;
  k.kaydedici.ondataavailable = (e) => {
    if (!e.data.size) return;
    k.parcalar.push(e.data);
    if (k.yukleyici) k.yukleyici.yaz(e.data);
  };
  k.saat = new Worker(URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 40)'], { type: 'text/javascript' })));
  k.saat.onmessage = ciz;
  k.kaydedici.start(2000);
  c.kayit = k;
  $('kayitDugme').textContent = '⏹ Kaydı durdur'; $('kayitDugme').setAttribute('aria-pressed', 'true');
  cagriDurumuYay(); kayitSeridiCiz();
}

async function kayitDurdur() {
  const c = durum.cagri, k = c && c.kayit;
  if (!k) return;
  c.kayit = null;
  $('kayitDugme').textContent = '⏺ Kaydet'; $('kayitDugme').setAttribute('aria-pressed', 'false');
  cagriDurumuYay(); kayitSeridiCiz();
  await new Promise((ok) => { k.kaydedici.onstop = ok; k.kaydedici.stop(); });
  k.saat.terminate(); k.kaynaklar.forEach((s) => s.disconnect());
  const sure = Math.round((Date.now() - k.baslangic) / 60000);
  if (k.yukleyici) {
    $('uyari').textContent = 'Kayıt Drive\'a yükleniyor…';
    try {
      const j = await k.yukleyici.bitir();
      $('uyari').textContent = '';
      await gonder(`🔴 ${k.ad} (${sure} dk)`, { ad: k.ad, url: j.url, boyut: j.boyut });
      return;
    } catch (e) { $('uyari').textContent = 'Kayıt Drive\'a yüklenemedi (' + e.message + '); bilgisayarına indiriliyor.'; }
  }
  indir(new Blob(k.parcalar, { type: 'video/webm' }), k.ad);
}

// ---------- beyaz tahta ----------
// Vuruşlar 0–1 aralığında koordinatlarla yayınlanır; her istemci kendi boyutunda çizer. Sonradan katılan,
// görüşmeye en erken girmiş tahta sahibinden mevcut vuruşları ister.
const TAHTA_W = 1600, TAHTA_H = 900;
const TAHTA_RENK = ['#111111', '#d32f2f', '#1565c0', '#2e7d32'];

function tahtaAcKapa(acik, yay) {
  const c = durum.cagri;
  if (!c || c.tahta === acik) return;
  c.tahta = acik;
  $('tahtaDugme').setAttribute('aria-pressed', String(acik));
  if (acik) tahtaKur(); else { c.tahtaKutu?.remove(); c.tahtaKutu = null; }
  if (yay) c.ch.send({ type: 'broadcast', event: 'tahta-durum', payload: { acik } });
  else if (acik) c.ch.send({ type: 'broadcast', event: 'tahta-iste', payload: { kimden: durum.ben.id } });
  cagriDurumuYay();
}

function tahtaKur() {
  const c = durum.cagri, kutu = el('div', 'tahta'), arac = el('div', 'tahta-arac'), tuval = el('canvas');
  tuval.width = TAHTA_W; tuval.height = TAHTA_H;
  c.tahtaKalem = c.tahtaKalem || { r: TAHTA_RENK[0], k: 4 };
  const dugmeler = [];
  const sec = (kalem) => { c.tahtaKalem = kalem; dugmeler.forEach(([d, k]) => d.setAttribute('aria-pressed', String(k.r === kalem.r && k.k === kalem.k))); };
  for (const r of TAHTA_RENK) {
    const d = el('button', 'renk'); d.style.background = r; d.setAttribute('aria-label', 'Kalem rengi ' + r);
    const k = { r, k: 4 }; d.onclick = () => sec(k); dugmeler.push([d, k]); arac.append(d);
  }
  const kalin = el('button', null, '✏️ Kalın'), silgi = el('button', null, '🧽 Silgi');
  const kalinK = { r: TAHTA_RENK[0], k: 12 }, silgiK = { r: '#ffffff', k: 40 };
  kalin.onclick = () => sec(kalinK); silgi.onclick = () => sec(silgiK);
  dugmeler.push([kalin, kalinK], [silgi, silgiK]);
  const temizle = el('button', null, '🗑️ Temizle'), kaydet = el('button', null, '💾 Resim olarak kaydet'), kapat = el('button', null, '✕ Kapat');
  temizle.onclick = () => { tahtaTemizle(); c.ch.send({ type: 'broadcast', event: 'tahta-temizle', payload: {} }); };
  kaydet.onclick = () => tuval.toBlob((b) => indir(b, 'Beyaz tahta.png'));
  kapat.onclick = () => tahtaAcKapa(false, true);
  arac.append(kalin, silgi, temizle, kaydet, kapat);
  kutu.append(arac, tuval);
  $('sahne').prepend(kutu);
  c.tahtaKutu = kutu; c.tahtaTuval = tuval;
  sec(c.tahtaKalem);
  tahtaTumunuCiz();

  let vurus = null, bekleyen = [], sonYayin = 0;
  const nokta = (e) => { const r = tuval.getBoundingClientRect(); return [+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)]; };
  const yayinla = (son) => {
    if (!vurus || (!bekleyen.length && !son)) return;
    c.ch.send({ type: 'broadcast', event: 'tahta', payload: { v: vurus.id, r: vurus.r, k: vurus.k, p: bekleyen, son } });
    bekleyen = []; sonYayin = Date.now();
  };
  tuval.onpointerdown = (e) => {
    tuval.setPointerCapture(e.pointerId);
    const [x, y] = nokta(e);
    vurus = { id: crypto.randomUUID(), r: c.tahtaKalem.r, k: c.tahtaKalem.k, p: [x, y] };
    c.tahtaVuruslar.set(vurus.id, vurus);
    bekleyen = [x, y];
    vurusParcasiCiz(vurus, 0);
  };
  tuval.onpointermove = (e) => {
    if (!vurus) return;
    const [x, y] = nokta(e), once = vurus.p.length;
    vurus.p.push(x, y); bekleyen.push(x, y);
    vurusParcasiCiz(vurus, once);
    if (Date.now() - sonYayin > 50) yayinla(false);
  };
  tuval.onpointerup = tuval.onpointercancel = () => { yayinla(true); vurus = null; };
}

// Vuruşun 'bas' indeksinden sonraki bölümünü çizer (artımlı çizim).
function vurusParcasiCiz(v, bas) {
  const t = durum.cagri && durum.cagri.tahtaTuval;
  if (!t) return;
  const x = t.getContext('2d');
  x.strokeStyle = v.r; x.lineWidth = v.k; x.lineCap = x.lineJoin = 'round';
  x.beginPath();
  const i0 = Math.max(0, bas - 2);
  x.moveTo(v.p[i0] * TAHTA_W, v.p[i0 + 1] * TAHTA_H);
  for (let i = i0; i < v.p.length; i += 2) x.lineTo(v.p[i] * TAHTA_W, v.p[i + 1] * TAHTA_H);
  if (v.p.length === 2) x.lineTo(v.p[0] * TAHTA_W + 0.1, v.p[1] * TAHTA_H); // tek dokunuş: nokta
  x.stroke();
}

function tahtaTumunuCiz() {
  const c = durum.cagri, t = c.tahtaTuval;
  if (!t) return;
  const x = t.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, TAHTA_W, TAHTA_H);
  for (const v of c.tahtaVuruslar.values()) vurusParcasiCiz(v, 0);
}

function tahtaVurusAl(m) {
  const c = durum.cagri;
  if (!c || !Array.isArray(m.p) || typeof m.v !== 'string') return;
  const v = c.tahtaVuruslar.get(m.v) || { id: m.v, r: String(m.r).slice(0, 9), k: Math.min(60, Number(m.k) || 4), p: [] };
  const once = v.p.length;
  v.p.push(...m.p.filter((n) => typeof n === 'number'));
  c.tahtaVuruslar.set(m.v, v);
  if (c.tahta) vurusParcasiCiz(v, once);
}

function tahtaTemizle() {
  durum.cagri.tahtaVuruslar.clear();
  tahtaTumunuCiz();
}

// Yalnız görüşmeye en erken girmiş tahta sahibi yanıtlar; vuruşlar küçük paketlerle gönderilir.
function tahtaIstendi(p) {
  const c = durum.cagri;
  if (!c || !c.tahta || !c.tahtaVuruslar.size) return;
  const dahaErken = [...c.katilanlar].some(([id, g]) => id !== p.kimden && g.tahta && g.katilma < c.katilma);
  if (dahaErken) return;
  const hepsi = [...c.tahtaVuruslar.values()];
  for (let i = 0; i < hepsi.length; i += 20) {
    c.ch.send({ type: 'broadcast', event: 'tahta-tum', payload: { kime: p.kimden, vuruslar: hepsi.slice(i, i + 20) } });
  }
}

// ---------- canlı altyazı ve döküm ----------
// Herkes kendi konuşmasını tarayıcının konuşma tanımasıyla yazıya çevirip yayınlar; herkes herkesin altyazısını
// görür ve dökümü biriktirir. Tanımayı desteklemeyen tarayıcıdaki kişi altyazıları görür ama konuşması yazılmaz.
const KonusmaTanima = window.SpeechRecognition || window.webkitSpeechRecognition;

function altyaziAcKapa(acik, yay) {
  const c = durum.cagri;
  if (!c || c.altyazi === acik) return;
  c.altyazi = acik;
  $('altyaziDugme').setAttribute('aria-pressed', String(acik));
  $('altyazi').hidden = !acik;
  $('dokumDugme').hidden = !c.dokum.length && !acik;
  if (yay) c.ch.send({ type: 'broadcast', event: 'altyazi-durum', payload: { acik, ad: durum.ben.ad } });
  cagriDurumuYay();
  tanimayiAyarla();
}

function tanimayiAyarla() {
  const c = durum.cagri, mik = c && c.yerel.getAudioTracks()[0];
  const calismali = c && c.altyazi && mik && mik.enabled;
  if (!calismali) { if (c && c.tanima) { c.tanima.durdu = true; c.tanima.abort(); c.tanima = null; } return; }
  if (c.tanima) return;
  if (!KonusmaTanima) { $('uyari').textContent = 'Bu tarayıcı konuşma tanımayı desteklemiyor; altyazıları görürsün ama konuşman yazılmaz.'; return; }
  const r = new KonusmaTanima();
  r.lang = 'tr-TR'; r.continuous = true; r.interimResults = true;
  r.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const metin = e.results[i][0].transcript.trim();
      if (metin) altyaziYay(metin, e.results[i].isFinal);
    }
  };
  r.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { r.durdu = true; $('uyari').textContent = 'Konuşma tanıma izni verilmedi.'; } };
  r.onend = () => { if (!r.durdu && durum.cagri === c && c.tanima === r) r.start(); }; // tarayıcı sessizlikte keser, yeniden başlat
  c.tanima = r;
  try { r.start(); } catch (e) { /* zaten çalışıyor */ }
}

function altyaziYay(metin, son) {
  const c = durum.cagri;
  const p = { kimden: durum.ben.id, ad: durum.ben.ad, metin: metin.slice(0, 500), son, zaman: new Date().toISOString(), sira: (c.altyaziSira = (c.altyaziSira || 0) + 1) };
  durum.cagri.ch.send({ type: 'broadcast', event: 'altyazi', payload: p });
  altyaziAl(p);
}

function altyaziAl(p) {

  if (!onceki || !(onceki.sira > p.sira)) c.altyazilar.set(p.kimden, { ad: p.ad, metin: p.metin, zaman: Date.now(), sira: p.sira });
  if (p.son) { c.dokum.push({ zaman: p.zaman, ad: p.ad, metin: p.metin }); $('dokumDugme').hidden = false; }

function altyaziCiz() {

// ---------- arka plan bulanıklaştırma / değiştirme (MediaPipe, tamamen tarayıcıda) ----------
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
let ayirici = null;
async function ayiriciAl() {
  if (ayirici) return ayirici;
  const { ImageSegmenter, FilesetResolver } = await import(`${MP}/vision_bundle.mjs`);
  const dosyalar = await FilesetResolver.forVisionTasks(`${MP}/wasm`);
  const ayar = (delegate) => ({ baseOptions: { modelAssetPath: MP_MODEL, delegate }, runningMode: 'VIDEO', outputCategoryMask: false, outputConfidenceMasks: true });
  try { ayirici = await ImageSegmenter.createFromOptions(dosyalar, ayar('GPU')); }
  catch (e) { ayirici = await ImageSegmenter.createFromOptions(dosyalar, ayar('CPU')); }
  return ayirici;
}

const ARKA_RENK = { mavi: ['#1e3c72', '#4f8fd6'], gri: ['#d9dde3', '#f4f5f7'], gunbatimi: ['#ff7e5f', '#feb47b'], orman: ['#134e5e', '#71b280'], gece: ['#0f2027', '#2c5364'] };
const BULANIK = { hafif: 6, bulanik: 14 }; // px
const ISIK = 'brightness(1.18) contrast(1.06) saturate(1.05)'; // "Işığı artır": yalnız kişiye uygulanır

function hazirArkaPlan(tur, w, h) {
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const x = t.getContext('2d'), g = x.createLinearGradient(0, 0, w, h);
  const [a, b] = ARKA_RENK[tur] || ARKA_RENK.gri;
  g.addColorStop(0, a); g.addColorStop(1, b);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  return t;
}

function arkaPlanDurdur() {
  const c = durum.cagri;
  if (!c || !c.arka) return;
  c.arka.dur = true; c.arka.saat.terminate(); c.arka.iz.stop(); c.arka.kaynak.srcObject = null;
  c.arka = null;
}

async function arkaPlanAyarla(tur, resim) {
  const c = durum.cagri;
  if (!c) return;
  arkaPlanDurdur();
  localStorage.setItem('ekip_arka', tur === 'resim' ? 'yok' : tur);
  const isik = localStorage.getItem('ekip_isik') === '1';
  if (tur === 'yok' && !isik) return videoyuYenile();
  const kam = c.yerel.getVideoTracks()[0];
  if (!kam) { $('uyari').textContent = 'Arka plan için kamera gerekli.'; $('secArka').value = 'yok'; return; }
  let seg = null; // yalnız ışık düzeltmesinde kişi ayırmaya gerek yok
  if (tur !== 'yok') {
    try { seg = await ayiriciAl(); }
    catch (e) { $('uyari').textContent = 'Arka plan modeli yüklenemedi: ' + e.message; $('secArka').value = 'yok'; return; }
  }
  if (durum.cagri !== c) return;
  const { width: w = 640, height: h = 360 } = kam.getSettings();
  const kaynak = el('video'); kaynak.muted = true; kaynak.playsInline = true; kaynak.srcObject = new MediaStream([kam]);
  await kaynak.play().catch(() => {});
  const tuval = Object.assign(document.createElement('canvas'), { width: w, height: h }), ctx = tuval.getContext('2d');
  const kisi = Object.assign(document.createElement('canvas'), { width: w, height: h }), kctx = kisi.getContext('2d');
  const maske = document.createElement('canvas'), mctx = maske.getContext('2d');
  const zemin = tur === 'yok' || BULANIK[tur] ? null : tur === 'resim' ? resim : hazirArkaPlan(tur, w, h);
  const arka = { tur, resim, kaynak, dur: false, iz: tuval.captureStream(30).getVideoTracks()[0] };
  arka.iz.enabled = kam.enabled;
  const isle = () => {
    if (arka.dur || kaynak.readyState < 2) return;
    if (!seg) { ctx.filter = ISIK; ctx.drawImage(kaynak, 0, 0, w, h); ctx.filter = 'none'; return; }
    seg.segmentForVideo(kaynak, performance.now(), (sonuc) => {
      const m = sonuc.confidenceMasks && sonuc.confidenceMasks[0];
      if (!m) return;
      const guven = m.getAsFloat32Array();
      if (maske.width !== m.width || maske.height !== m.height) { maske.width = m.width; maske.height = m.height; }
      const img = mctx.createImageData(m.width, m.height);
      for (let i = 0; i < guven.length; i++) img.data[i * 4 + 3] = guven[i] * 255;
      mctx.putImageData(img, 0, 0);
      if (zemin) ctx.drawImage(zemin, 0, 0, w, h);
      else { ctx.filter = `blur(${BULANIK[tur]}px)`; ctx.drawImage(kaynak, 0, 0, w, h); ctx.filter = 'none'; }
      kctx.globalCompositeOperation = 'copy'; kctx.filter = isik ? ISIK : 'none'; kctx.drawImage(kaynak, 0, 0, w, h); kctx.filter = 'none';
      kctx.globalCompositeOperation = 'destination-in'; kctx.drawImage(maske, 0, 0, w, h);
      ctx.drawImage(kisi, 0, 0);
    });
  };
  // Sayfa zamanlayıcıları ve kare geri çağrıları sekme gizlenince durur; Worker zamanlayıcısı durmaz,
  // böylece görüşmedeyken başka sekmeye geçince görüntü donmaz.
  arka.saat = new Worker(URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 40)'], { type: 'text/javascript' })));
  arka.saat.onmessage = isle;
  isle();
  c.arka = arka;
  videoyuYenile();
}

async function arkaPlanSecildi(tur) {
  if (tur !== 'resim') return arkaPlanAyarla(tur);
  $('arkaResim').value = '';
  $('arkaResim').click();
}

async function arkaResimYuklendi(dosya) {
  if (!dosya) return;
  const img = new Image();
  img.src = URL.createObjectURL(dosya);
  try { await img.decode(); } catch (e) { $('uyari').textContent = 'Resim açılamadı.'; return; }
  arkaPlanAyarla('resim', img);
}

function sesiYenile() {
  for (const es of durum.cagri.esler.values()) {
    const tr = es.pc && es.pc.getTransceivers().find((t) => t.receiver.track.kind === 'audio');
    if (tr) tr.sender.replaceTrack(gonderilecekSes());
  }
  if (durum.cagri.sfu) sfuYayinla();
}

function ekranBitti() {
  const c = durum.cagri;
  if (!c) return;
  [c.ekran, c.ekranSes, c.karisik].forEach((t) => t && t.stop());
  c.ekran = c.ekranSes = c.karisik = null;
  $('ekranDugme').setAttribute('aria-pressed', 'false');
  videoyuYenile(); sesiYenile(); cagriDurumuYay();
}

async function ekranPaylas() {
  const c = durum.cagri;
  if (c.ekran) return ekranBitti();
  if (!gonderebilir(durum.ben.id, 'ekran')) return;
  let akis;
  // audio:true → tarayıcı "sesi de paylaş" seçeneği sunar (sekme ya da tüm ekran sesi)
  try { akis = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }); }
  catch (e) { return; } // kullanıcı vazgeçti
  c.ekran = akis.getVideoTracks()[0];
  c.ekran.onended = ekranBitti;
  c.ekranSes = akis.getAudioTracks()[0] || null;
  if (c.ekranSes) {
    // Tek ses izi gönderiliyor: mikrofon + bilgisayar sesi karıştırılır; mikrofon kapatılırsa karışıma sessizlik girer.
    const ctx = sesBaglami(), hedef = ctx.createMediaStreamDestination();
    const mik = c.yerel.getAudioTracks()[0];
    if (mik) ctx.createMediaStreamSource(new MediaStream([mik])).connect(hedef);
    ctx.createMediaStreamSource(new MediaStream([c.ekranSes])).connect(hedef);
    c.karisik = hedef.stream.getAudioTracks()[0];
  }
  $('ekranDugme').setAttribute('aria-pressed', 'true');
  videoyuYenile(); sesiYenile(); cagriDurumuYay(); // "ekran" bilgisi düzeni (kenar çubuğu) belirler
}

function izAcKapa(tur, dugme) {
  const t = tur === 'ses' ? durum.cagri.yerel.getAudioTracks()[0] : durum.cagri.yerel.getVideoTracks()[0];
  if (!t) return;
  t.enabled = !t.enabled;
  if (tur === 'video' && durum.cagri.arka) durum.cagri.arka.iz.enabled = t.enabled;
  if (tur === 'ses') { tanimayiAyarla(); cagriDurumuYay(); } // mikrofon kapalıyken konuşma yazıya çevrilmez; kişiler listesinde 🔇
  dugme.setAttribute('aria-pressed', String(t.enabled));
}

// ---------- konuşanı vurgulama ----------
function sesBaglami() {
  const c = durum.cagri;
  if (!c.sesCtx) c.sesCtx = new AudioContext();
  if (c.sesCtx.state === 'suspended') c.sesCtx.resume().catch(() => {});
  return c.sesCtx;
}

function analizEkle(id, iz) {
  analizKaldir(id);
  const ctx = sesBaglami();
  const kaynak = ctx.createMediaStreamSource(new MediaStream([iz]));
  const analiz = ctx.createAnalyser(); analiz.fftSize = 512;
  kaynak.connect(analiz);
  durum.cagri.analizler.set(id, { kaynak, analiz, iz, veri: new Uint8Array(analiz.fftSize) });
}

function analizKaldir(id) {
  const a = durum.cagri && durum.cagri.analizler.get(id);
  if (a) { a.kaynak.disconnect(); durum.cagri.analizler.delete(id); }
}

const KONUSMA_ESIGI = 0.03; // ponytail: sabit eşik; gürültülü ortamda yanlış vurgu olursa ayar eklenir
function konusmayiOlc() {
  const c = durum.cagri;
  if (!c) return;
  const simdi = Date.now();
  for (const [id, a] of c.analizler) {
    a.analiz.getByteTimeDomainData(a.veri);
    let top = 0;
    for (const v of a.veri) { const x = (v - 128) / 128; top += x * x; }
    if (a.iz.enabled && Math.sqrt(top / a.veri.length) > KONUSMA_ESIGI) c.konusma.set(id, simdi);
    // kısa duraklamalarda çerçeve yanıp sönmesin diye 600 ms tutulur
    karo(id)?.classList.toggle('konusuyor', simdi - (c.konusma.get(id) || 0) < 600);
  }
  duzenUygula(); sureyiYaz();
}

// ---------- el kaldırma (sıralı), tepkiler, görüşme sohbeti ----------
// el: false ya da kaldırıldığı an; sıra kaldırılma anına göre.
function elleriCiz() {
  const c = durum.cagri;
  const eller = [[durum.ben.id, c.el], ...[...c.katilanlar].map(([id, g]) => [id, g.el])].filter(([, t]) => t).sort((a, b) => Number(a[1]) - Number(b[1]));
  c.elSirasi = new Map(eller.map(([id], i) => [id, i + 1]));
  for (const k of $('sahne').querySelectorAll('.karo')) elIsaretle(k.dataset.id, c.elSirasi.get(k.dataset.id));
}

function elIsaretle(id, sira) {
  const k = karo(id);
  if (!k) return;
  let r = k.querySelector('.el');
  if (!sira) { r?.remove(); return; }
  if (!r) { r = el('span', 'el'); k.append(r); }
  r.textContent = '✋' + (durum.cagri.elSirasi.size > 1 ? sira : '');
  r.setAttribute('aria-label', `El kaldırdı, sırası ${sira}`);
}

function elKaldir() {
  const c = durum.cagri;
  c.el = c.el ? false : Date.now();
  $('elDugme').setAttribute('aria-pressed', String(!!c.el));
  $('elDugme').textContent = c.el ? '✋ Eli indir' : '✋ El kaldır';
  elleriCiz(); kisileriCizCagri();
  cagriDurumuYay();
}

const TEPKILER = ['👍', '❤️', '😂', '👏', '🎉'];
function tepkiGoster(id, emoji) {
  const k = karo(id);
  if (!k || !TEPKILER.includes(emoji)) return;
  const t = el('span', 'tepki', emoji);
  k.append(t);
  setTimeout(() => t.remove(), 2300);

function tepkiGonder(emoji) {
  if (!gonderebilir(durum.ben.id, 'tepki')) return;
  durum.cagri.ch.send({ type: 'broadcast', event: 'tepki', payload: { kimden: durum.ben.id, emoji } });
  tepkiGoster(durum.ben.id, emoji);
}

// sistem: "… mikrofonunu kapattı" gibi bilgi satırı; AI özetine girmez.
function gSohbetEkle(m, sistem) {
  const c = durum.cagri;
  if (!c || typeof m.metin !== 'string') return;
  const satir = el('div');
  satir.append(el('b', null, String(m.ad).slice(0, 60)), document.createTextNode(m.metin.slice(0, 1000)));
  $('gSohbetListe').append(satir);
  $('gSohbetListe').scrollTop = $('gSohbetListe').scrollHeight;
  if (!sistem) c.sohbetKaydi.push({ zaman: new Date().toISOString(), ad: String(m.ad).slice(0, 60), metin: m.metin.slice(0, 1000) });
  if (!sistem && m.kimden !== durum.ben.id) panelUyarisi('sohbet');

function gSohbetAcKapa() {
  const acik = $('gSohbet').hidden;
  $('gSohbet').hidden = !acik;
  $('gSohbetDugme').setAttribute('aria-pressed', String(acik));

// Yan panel: Sohbet | Kişiler | Anket | Soru-Cevap. Kapalı ya da başka sekmedeyken gelen yenilik işaretlenir.
function panelBolumu(b) {
  const c = durum.cagri;

function panelUyarisi(b) {

function panelDugmesi() {

// ---------- katılmadan önce önizleme (Meet'teki "hazır mısın" ekranı) ----------
async function onizlemeGoster(yerel) {
  const d = $('onizleme'), mik = yerel.getAudioTracks()[0], kam = yerel.getVideoTracks()[0];
  $('onizlemeVideo').srcObject = yerel;
  for (const [dugme, iz] of [[$('onMik'), mik], [$('onKam'), kam]]) {
    dugme.disabled = !iz;
    dugme.setAttribute('aria-pressed', String(!!iz && iz.enabled));
    dugme.onclick = () => { iz.enabled = !iz.enabled; dugme.setAttribute('aria-pressed', String(iz.enabled)); };
  }
  $('onArka').replaceChildren(...[...$('secArka').options].filter((o) => o.value !== 'resim').map((o) => o.cloneNode(true)));
  $('onArka').value = localStorage.getItem('ekip_arka') || 'yok';
  $('onIsik').checked = localStorage.getItem('ekip_isik') === '1';
  $('onArka').onchange = (e) => localStorage.setItem('ekip_arka', e.target.value);
  $('onIsik').onchange = (e) => localStorage.setItem('ekip_isik', e.target.checked ? '1' : '0');
  let ctx = null, olcer = 0; // mikrofon seviyesi: konuşunca çubuk dolar
  if (mik) {
    ctx = new AudioContext();
    const a = ctx.createAnalyser(), v = new Uint8Array(512);
    ctx.createMediaStreamSource(new MediaStream([mik])).connect(a);
    olcer = setInterval(() => {
      a.getByteTimeDomainData(v);
      let t = 0; for (const x of v) t += ((x - 128) / 128) ** 2;
      $('onSes').value = mik.enabled ? Math.min(1, Math.sqrt(t / v.length) * 6) : 0;
    }, 100);
  }
  d.returnValue = '';
  d.showModal();
  // Gönderim anı doğrudan yakalanır: "close" olayı sekme çizilmezken (arka planda) gecikebiliyor.
  const secim = await new Promise((ok) => {
    d.querySelector('form').onsubmit = (e) => ok(e.submitter && e.submitter.value);
    d.onclose = () => ok(d.returnValue);
  });
  if (d.open) d.close();
  clearInterval(olcer); if (ctx) ctx.close();
  $('onizlemeVideo').srcObject = null;
  return secim === 'katil';
}

// ---------- toplantı sahibi: kilit, misafir izinleri, kişiler, katılım raporu, bitir ----------
const erpMi = (id) => (id === durum.ben.id ? durum.cagri.erp : !!durum.cagri.katilanlar.get(id)?.erp);
const kilitli = () => durum.cagri.kilit || [...durum.cagri.katilanlar.values()].some((g) => g.erp && g.kilit);
// Misafir izni: görüşmedeki sahiplerden biri kapattıysa kapalı; ERP kullanıcısı (sahip) her zaman serbest.
const gonderebilir = (id, tur) => erpMi(id) || (durum.cagri.izinler[tur] !== false &&
  [...durum.cagri.katilanlar.values()].every((g) => !g.erp || !g.izinler || g.izinler[tur] !== false));

function izinleriUygula() {
  const c = durum.cagri, [sohbet, ekran, tepki] = ['sohbet', 'ekran', 'tepki'].map((t) => gonderebilir(durum.ben.id, t));
  $('gSohbetMetin').disabled = !sohbet;
  $('gSohbetMetin').placeholder = sohbet ? 'Görüşmeye yaz…' : 'Toplantı sahibi sohbeti kapattı';
  if (!ekran && c.ekran) ekranBitti();
  $('ekranDugme').disabled = !ekran;
  $('tepkiler').querySelectorAll('button').forEach((b) => { b.disabled = !tepki; });
}

function kilitDugmesi() {
  const c = durum.cagri;
  $('kilitDugme').setAttribute('aria-pressed', String(c.kilit));
  $('kilitDugme').textContent = c.kilit ? '🔓 Kilidi aç' : '🔒 Toplantıyı kilitle';
}

function kisileriCizCagri() {
  const c = durum.cagri, mik = c.yerel.getAudioTracks()[0];
  const liste = [[durum.ben.id, { ad: durum.ben.ad + ' (sen)', erp: c.erp, mik: !!mik && mik.enabled }], ...c.katilanlar];
  $('kisilerListe').replaceChildren(el('div', 'bilgi', `${liste.length} kişi · 👑 toplantı sahibi`), ...liste.map(([id, g]) => {
    const s = el('div', 'kisi'), bekliyor = id !== durum.ben.id && !izinli(id, g), sira = c.elSirasi.get(id);
    s.append(el('span', 'ad', g.ad), el('span', null, [g.erp ? '👑' : '', sira ? '✋' + sira : '', g.mik === false ? '🔇' : '', bekliyor ? '⏳' : ''].join(' ')));
    if (c.erp && id !== durum.ben.id && !bekliyor) {
      const dugme = (yazi, baslik, fn) => { const b = el('button', null, yazi); b.title = baslik; b.setAttribute('aria-label', baslik); b.onclick = fn; s.append(b); };
      if (g.mik !== false) dugme('🔇', 'Mikrofonunu kapat', () => komutGonder('sustur', id));
      if (sira) dugme('✋↓', 'Elini indir', () => komutGonder('el-indir', id));
      dugme('⛔', 'Görüşmeden çıkar', () => disariCikar(id));
    }
    return s;
  }));
}

function katilimiIsle() {
  const c = durum.cagri, simdi = new Date().toISOString();
  for (const [id, g] of c.katilanlar) {
    if (!izinli(id, g)) continue;
    const k = c.katilim.get(id);
    if (!k) c.katilim.set(id, { ad: g.ad, erp: !!g.erp, giris: simdi, cikis: null });
    else k.cikis = null; // ayrılıp geri geldi
  }
  for (const [id, k] of c.katilim) if (id !== durum.ben.id && !k.cikis && !c.katilanlar.has(id)) k.cikis = simdi;
}

function katilimRaporu() {
  const c = durum.cagri, simdi = Date.now(), saat = (t) => new Date(t).toLocaleString('tr-TR');
  const satirlar = [['Ad', 'Rol', 'Giriş', 'Çıkış', 'Süre (dk)'], ...[...c.katilim.values()].map((k) => [
    k.ad, k.erp ? 'ERP' : 'Misafir', saat(k.giris), k.cikis ? saat(k.cikis) : 'görüşmede',
    Math.round(((k.cikis ? zaman(k.cikis) : simdi) - zaman(k.giris)) / 60000)])];
  const csv = '﻿' + satirlar.map((s) => s.map((h) => `"${String(h).replace(/"/g, '""')}"`).join(';')).join('\r\n'); // Excel için BOM ve ;
  indir(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `Katılım raporu ${new Date().toLocaleString('tr-TR').replace(/[/:]/g, '-')}.csv`);
}

// ---------- süre, düzen, küçük pencere, kısayollar ----------
function sureyiYaz() {
  const c = durum.cagri, simdi = Date.now();
  const bas = Math.min(c.baslangic, ...[...c.katilanlar.values()].map((g) => g.bas || Infinity));
  const yazi = mmss(Math.max(0, Math.floor((simdi - bas) / 1000)));
  if ($('sure').textContent !== yazi) $('sure').textContent = yazi;
  if (c.altOda) $('altOdaMetin').textContent = `🚪 Alt oda ${c.altOda.no} · ${mmss(Math.max(0, Math.round((c.altOda.bitis - simdi) / 1000)))} kaldı · süre dolunca ana odaya dönülür`;
  if (c.altOdalar && simdi > c.altOdalar.bitis + 5000) { c.altOdalar = null; odaListesiCiz(); }
}

// Döşeme: herkes eşit. Spot: tek kişi. Kenar: biri büyük, diğerleri yanda. Otomatik: ekran paylaşılırken kenar.
// Büyük gösterilen: sabitlenen > ekran paylaşan > son konuşan > ilk diğer kişi.
function duzenUygula() {
  const c = durum.cagri, sahne = $('sahne');
  const ekranci = c.ekran ? durum.ben.id : [...c.katilanlar].find(([id, g]) => g.ekran && c.esler.has(id))?.[0];
  const duzen = c.duzen === 'oto' ? (ekranci ? 'kenar' : 'doseme') : c.duzen;
  if (sahne.dataset.duzen !== duzen) sahne.dataset.duzen = duzen;
  if (duzen === 'doseme') return;
  let enSon = Date.now() - 3000;
  for (const [id, t] of c.konusma) if (id !== durum.ben.id && t > enSon && c.esler.has(id)) { enSon = t; c.sonKonusan = id; }
  const karolar = [...sahne.querySelectorAll('.karo')];
  const ana = sahne.querySelector('.karo.buyuk') || (ekranci && karo(ekranci)) || (c.sonKonusan && karo(c.sonKonusan)) ||
    karolar.find((k) => !k.classList.contains('ben')) || karolar[0];
  karolar.forEach((k) => k.classList.toggle('ana-karo', k === ana));
}

// Document Picture-in-Picture (Chrome/Edge): görüşme, düğmeleriyle birlikte her zaman üstte duran pencereye taşınır.
// Desteklemeyen tarayıcıda yalnız ana görüntü küçük pencereye alınır.
const PIP_OGELER = ['altOdaBilgi', 'gorusme', 'altyazi', 'cagriCubugu'];
const videolariOynat = (belge) => belge.querySelectorAll('video').forEach((v) => v.play().catch(() => {}));
async function pipAc() {
  if ($('dahaMenu').matches(':popover-open')) $('dahaMenu').hidePopover();
  if (pipPencere) return pipKapat();
  const tekGoruntu = () => {
    const v = $('sahne').querySelector('.karo.ana-karo video, .karo:not(.ben) video, .karo video');
    return v && v.requestPictureInPicture().catch(() => {});
  };
  if (!window.documentPictureInPicture) return tekGoruntu();
  let w;
  try { w = await documentPictureInPicture.requestWindow({ width: 520, height: 420 }); }
  catch (e) { return tekGoruntu(); } // gömülü tarayıcılar ayrı pencereye izin vermeyebilir
  w.document.head.append(Object.assign(w.document.createElement('style'), { textContent: document.querySelector('style').textContent }));
  w.document.body.className = 'pip';
  pipYeri = document.createComment('pip');
  $(PIP_OGELER[0]).before(pipYeri);
  w.document.body.append(...PIP_OGELER.map((id) => $(id)));
  pipPencere = w;
  w.document.addEventListener('keydown', kisayol);
  w.addEventListener('pagehide', pipKapat);
  videolariOynat(w.document);
}
function pipKapat() {
  const w = pipPencere;
  if (!w) return;
  pipPencere = null;
  pipYeri.after(...PIP_OGELER.map((id) => w.document.getElementById(id)));
  pipYeri.remove();
  videolariOynat(document);
  w.close();
}

// Meet kısayolları: Ctrl+D mikrofon, Ctrl+E kamera.
function kisayol(e) {
  if (!durum.cagri || !(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
  const d = { d: 'mikDugme', e: 'kamDugme' }[e.key.toLowerCase()];
  if (d) { e.preventDefault(); $(d).click(); }
}

// ---------- anket ve soru-cevap (görüşme kanalında; sonradan katılana en erken sahip aktarır) ----------
const anketSayisi = (a, i) => [...a.oylar.values()].filter((x) => x === i).length;

function anketAl(p, aktarim) {
  const c = durum.cagri;
  if (!c || typeof p.soru !== 'string' || !Array.isArray(p.secenekler)) return;
  if (!aktarim && (c.anketler.has(p.id) || !erpMi(p.kimden))) return; // anketi yalnız sahipler açar
  const a = c.anketler.get(p.id) || { id: String(p.id), soru: p.soru.slice(0, 200), secenekler: p.secenekler.slice(0, 6).map((s) => String(s).slice(0, 100)),
                                      sahip: p.kimden, ad: String(p.ad || '').slice(0, 60), oylar: new Map(), acik: true };
  if (Array.isArray(p.oylar)) p.oylar.forEach(([k, i]) => a.oylar.set(String(k), Number(i)));
  if (p.acik === false) a.acik = false;
  const yeni = !c.anketler.has(a.id);
  c.anketler.set(a.id, a);
  if (yeni && p.kimden !== durum.ben.id) { gSohbetEkle({ ad: '📊 ', metin: `${a.ad} anket başlattı: ${a.soru}` }, true); panelUyarisi('anket'); }
  anketCiz();
}

function anketBaslat(soru, secenekler) {
  const p = { id: crypto.randomUUID(), soru, secenekler, kimden: durum.ben.id, ad: durum.ben.ad };
  durum.cagri.ch.send({ type: 'broadcast', event: 'anket', payload: p });
  anketAl(p);
}

function oyVer(a, i) {
  const p = { id: a.id, i, kimden: durum.ben.id };
  durum.cagri.ch.send({ type: 'broadcast', event: 'anket-oy', payload: p });
  oyAl(p);
}

function oyAl(p) {
  const a = durum.cagri && durum.cagri.anketler.get(p.id);
  if (!a || !a.acik || !(p.i >= 0 && p.i < a.secenekler.length)) return;
  a.oylar.set(String(p.kimden), p.i);
  anketCiz();
}

// Biten anketin sonucu kalıcı olsun diye kanala mesaj olarak yazılır.
function anketKapat(a, yay) {
  if (!a.acik) return;
  a.acik = false;
  if (yay) {
    durum.cagri.ch.send({ type: 'broadcast', event: 'anket-kapat', payload: { id: a.id, kimden: durum.ben.id } });
    gonder(`📊 Anket sonucu: ${a.soru}\n` + a.secenekler.map((s, i) => `• ${s}: ${anketSayisi(a, i)} oy`).join('\n'));
  }
  anketCiz();
}

function anketCiz() {
  const c = durum.cagri, kok = $('anketListe');
  kok.replaceChildren(...[...c.anketler.values()].reverse().map((a) => {
    const kutu = el('div', 'anket'), toplam = a.oylar.size, benim = a.oylar.get(durum.ben.id);
    kutu.append(el('b', null, a.soru), el('div', 'bilgi', `${a.ad} · ${toplam} oy${a.acik ? '' : ' · bitti'}`));
    a.secenekler.forEach((s, i) => {
      const n = anketSayisi(a, i), yuzde = toplam ? Math.round((n * 100) / toplam) : 0;
      const b = el('button', 'secenek' + (benim === i ? ' benim' : '')), cubuk = el('i', 'cubuk');
      cubuk.style.width = yuzde + '%';
      b.append(cubuk, el('span', null, `${s} — ${n} (%${yuzde})`));
      b.disabled = !a.acik; b.onclick = () => oyVer(a, i);
      kutu.append(b);
    });
    if (a.acik && c.erp) { const k = el('button', null, 'Anketi bitir, sonucu kanala yaz'); k.onclick = () => anketKapat(a, true); kutu.append(k); }
    return kutu;
  }));
  if (!c.anketler.size) kok.append(el('div', 'bilgi', c.erp ? 'Henüz anket yok; aşağıdan başlatabilirsin.' : 'Henüz anket yok.'));
}

function soruAl(p, aktarim) {
  const c = durum.cagri;
  if (!c || typeof p.metin !== 'string' || (!aktarim && c.sorular.has(p.id))) return;
  const s = c.sorular.get(p.id) || { id: String(p.id), metin: p.metin.slice(0, 300), ad: String(p.ad || '').slice(0, 60), kimden: p.kimden,
                                     oylar: new Set(), cevaplandi: false, zaman: Number(p.zaman) || Date.now() };
  if (Array.isArray(p.oylar)) p.oylar.forEach((k) => s.oylar.add(String(k)));
  if (p.cevaplandi) s.cevaplandi = true;
  const yeni = !c.sorular.has(s.id);
  c.sorular.set(s.id, s);
  if (yeni && !aktarim && p.kimden !== durum.ben.id) panelUyarisi('soru');
  soruCiz();
}

function soruSor(metin) {
  const p = { id: crypto.randomUUID(), metin, ad: durum.ben.ad, kimden: durum.ben.id, zaman: Date.now() };
  durum.cagri.ch.send({ type: 'broadcast', event: 'soru', payload: p });
  soruAl(p);
}

function soruOyu(s) {
  const p = { id: s.id, kimden: durum.ben.id, var: !s.oylar.has(durum.ben.id) };
  durum.cagri.ch.send({ type: 'broadcast', event: 'soru-oy', payload: p });
  soruOyuAl(p);
}

function soruOyuAl(p) {
  const s = durum.cagri && durum.cagri.sorular.get(p.id);
  if (!s) return;
  if (p.var) s.oylar.add(String(p.kimden)); else s.oylar.delete(String(p.kimden));
  soruCiz();
}

function soruCevapAl(p) {
  const s = durum.cagri && durum.cagri.sorular.get(p.id);
  if (!s || !erpMi(p.kimden)) return;
  s.cevaplandi = true;
  if (p.kimden === durum.ben.id) durum.cagri.ch.send({ type: 'broadcast', event: 'soru-cevap', payload: p });
  soruCiz();
}

// Öne çıkarılanlar üstte, yanıtlananlar en altta.
function soruCiz() {
  const c = durum.cagri, kok = $('soruListe');
  const liste = [...c.sorular.values()].sort((a, b) => a.cevaplandi - b.cevaplandi || b.oylar.size - a.oylar.size || a.zaman - b.zaman);
  kok.replaceChildren(...liste.map((s) => {
    const d = el('div', 'soru' + (s.cevaplandi ? ' cevaplandi' : '')), alt = el('div', 'alt');
    const oy = el('button', s.oylar.has(durum.ben.id) ? 'ana' : null, `▲ ${s.oylar.size}`);
    oy.title = 'Bu soruyu öne çıkar'; oy.onclick = () => soruOyu(s);
    alt.append(oy, el('span', null, s.ad + (s.cevaplandi ? ' · yanıtlandı' : '')));
    if (c.erp && !s.cevaplandi) { const y = el('button', null, '✓ Yanıtlandı'); y.onclick = () => soruCevapAl({ id: s.id, kimden: durum.ben.id }); alt.append(y); }
    d.append(el('div', 'metin', s.metin), alt);
    return d;
  }));
  if (!liste.length) kok.append(el('div', 'bilgi', 'Henüz soru yok. Sorunu yaz; diğerleri ▲ ile öne çıkarabilir.'));
}

function durumAktar(id) {
  const c = durum.cagri;
  if (!c.erp || (!c.anketler.size && !c.sorular.size)) return;
  const dahaErkenSahip = [...c.katilanlar].some(([x, g]) => x !== id && g.erp && (g.katilma < c.katilma || (g.katilma === c.katilma && x < durum.ben.id)));
  if (dahaErkenSahip) return;
  c.ch.send({ type: 'broadcast', event: 'aktar', payload: { kime: id, kimden: durum.ben.id,
    anketler: [...c.anketler.values()].map((a) => ({ ...a, oylar: [...a.oylar] })),
    sorular: [...c.sorular.values()].map((s) => ({ ...s, oylar: [...s.oylar] })) } });
}

function aktarAl(p) {
  if (p.kime !== durum.ben.id || !erpMi(p.kimden)) return;
  (p.anketler || []).forEach((a) => anketAl({ ...a, kimden: a.sahip }, true));
  (p.sorular || []).forEach((s) => soruAl(s, true));
}

// ---------- alt odalar ----------
// Sahip, içerideki herkesi (kendisi hariç) rastgele N odaya dağıtır. Her alt oda ayrı bir görüşme kanalıdır
// ('<kanal>~odaN'); odadakiler ana kanalı da dinler, süre dolunca ya da sahip kapatınca ana odaya döner.
function altOdalariAc() {
  const c = durum.cagri;
  const n = Math.min(9, Math.max(2, Number($('odaSayi').value) || 2)), dk = Math.min(120, Math.max(1, Number($('odaSure').value) || 10));
  const kisiler = [...c.katilanlar].filter(([id, g]) => izinli(id, g));
  if (kisiler.length < 2) { $('uyari').textContent = 'Alt oda için senin dışında en az iki katılımcı gerekli.'; return; }
  for (let i = kisiler.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [kisiler[i], kisiler[j]] = [kisiler[j], kisiler[i]]; }
  const p = { kimden: durum.ben.id, bitis: Date.now() + dk * 60000,
              atama: Object.fromEntries(kisiler.map(([id], i) => [id, (i % n) + 1])),
              adlar: Object.fromEntries(kisiler.map(([id, g]) => [id, g.ad])),
              kabul: [durum.ben.id, ...kisiler.map(([id]) => id)],
              sahipler: [durum.ben.id, ...kisiler.filter(([, g]) => g.erp).map(([id]) => id)] };
  c.ch.send({ type: 'broadcast', event: 'alt-oda', payload: p });
  c.altOdalar = p; odaListesiCiz();
}

function altOdaAl(p) {
  const c = durum.cagri;
  if (!c || !erpMi(p.kimden) || !p.atama || typeof p.atama !== 'object') return;
  c.altOdalar = p; odaListesiCiz();
  const no = Number(p.atama[durum.ben.id]);
  if (no >= 1 && no <= 9) altOdayaGec(no, p);
}

// no 0: ana odaya dön. kapandi: sahip odaları kapattı, oda listesi taşınmaz.
async function altOdayaGec(no, p, kapandi) {
  const c = durum.cagri;
  if (!c || durum.katiliyor) return;
  const ana = c.anaKanal || c.kanal, mik = c.yerel.getAudioTracks()[0], kam = c.yerel.getVideoTracks()[0];
  // İçeri alınmışlar ve çıkarılanlar odalar arasında taşınır: dönen misafir yeniden bekleme salonuna düşmez.
  const ayar = { onizlemesiz: true, mik: mik && mik.enabled, kam: kam && kam.enabled, baslangic: c.baslangic, altOdalar: kapandi ? null : c.altOdalar,
                 kabul: no ? p.kabul : [...sahipListesi('kabuller')], cikar: [...sahipListesi('cikarilanlar')], katilim: c.katilim };
  if (no) Object.assign(ayar, { ana, altOda: { no, bitis: p.bitis, sahipler: p.sahipler } });
  await cagridanAyril(true);
  await cagriyaKatil(no ? `${ana}~oda${no}` : ana, ayar);
}

function odaListesiCiz() {
  const c = durum.cagri, kok = $('odaListesi'), p = c.altOdalar;
  $('odaAc').hidden = !!p;
  kok.replaceChildren();
  if (!p) return;
  const odalar = new Map();
  for (const [id, no] of Object.entries(p.atama)) odalar.set(no, [...(odalar.get(no) || []), (p.adlar && p.adlar[id]) || '?']);
  for (const [no, adlar] of [...odalar].sort((a, b) => a[0] - b[0])) {
    const satir = el('div', 'satir2'), burada = !!(c.altOda && c.altOda.no === no), git = el('button', null, burada ? 'Buradasın' : 'Git');
    git.disabled = burada; git.onclick = () => altOdayaGec(no, p);
    satir.append(el('span', null, `Oda ${no}: ${adlar.join(', ')}`), git);
    kok.append(satir);
  }
  const kapat = el('button', 'tehlike', 'Alt odaları kapat, herkesi geri çağır');
  kapat.onclick = altOdalariKapat;
  kok.append(kapat);
}

function altOdalariKapat() {
  const c = durum.cagri;
  (c.anaCh || c.ch).send({ type: 'broadcast', event: 'alt-oda-bitir', payload: { kimden: durum.ben.id } });
  c.altOdalar = null; odaListesiCiz();
  if (c.altOda) altOdayaGec(0, null, true);
}

// ---------- Claude: toplantı özeti ve altyazı çevirisi (Apps Script üzerinden; anahtar tarayıcıya gelmez) ----------
async function ozetCikar() {
  const c = durum.cagri;
  if (!c.dokum.length && !c.sohbetKaydi.length) { $('uyari').textContent = 'Özet, altyazı dökümünden çıkarılır: önce CC Altyazı\'yı aç ve biraz konuşun.'; return; }
  const saat = (t) => new Date(t).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  const metin = ['KATILIMCILAR: ' + [...c.katilim.values()].map((k) => k.ad).join(', '),
    '', 'KONUŞMA DÖKÜMÜ', ...c.dokum.map((d) => `[${saat(d.zaman)}] ${d.ad}: ${d.metin}`),
    '', 'GÖRÜŞME SOHBETİ', ...c.sohbetKaydi.map((m) => `[${saat(m.zaman)}] ${m.ad}: ${m.metin}`)].join('\n');
  const k = c.anaKanal || c.kanal;
  $('ozetDugme').disabled = true; $('uyari').textContent = '✨ AI özeti hazırlanıyor…';
  try {
    const { ozet } = await betikIstegi({ islem: 'ozet', metin, konu: k.startsWith('misafir-') ? 'Bağlantılı görüşme' : kanalBasligi(k) });
    $('uyari').textContent = '';
    const tam = `✨ Toplantı özeti · ${tarihYaz(new Date().toISOString())}\n\n${ozet}`;
    if (tam.length <= 4000) await gonder(tam);
    else await dosyaGonder(new File([tam], 'Toplantı özeti.txt', { type: 'text/plain;charset=utf-8' })); // mesaj sınırı 4000
  } catch (e) { $('uyari').textContent = 'AI özeti çıkarılamadı: ' + e.message; }
  finally { $('ozetDugme').disabled = false; }
}

// Başkasının bitmiş altyazı cümlesi seçilen dile çevrilip ayrı satırda gösterilir (döküm özgün dilde kalır).
async function ceviriIste(p) {
  const c = durum.cagri, dil = c.ceviri;
  try {
    const { metin } = await betikIstegi({ islem: 'cevir', metin: p.metin, dil }, 20000);
    if (durum.cagri !== c || c.ceviri !== dil) return;
    const onceki = c.altyazilar.get(p.kimden + '~ceviri');
    if (onceki && onceki.sira > p.sira) return; // sonraki cümlenin çevirisi önce geldi
    c.altyazilar.set(p.kimden + '~ceviri', { ad: p.ad + ' 🌐', metin, zaman: Date.now(), sira: p.sira });
    altyaziCiz();
  } catch (e) { console.warn('çeviri', e.message); }
}

// ---------- kalabalık görüşme: LiveKit sunucusu (SFU) ----------
// Herkes herkese bağlantıda her kişi görüntüsünü herkese ayrı gönderir; 6 kişiden sonra bant genişliği yetmez.
// KALABALIK kişiye ulaşınca (ya da biri geçmişse) herkes LiveKit odasına geçer: herkes bir kez yollar, sunucu dağıtır.
// Görüntü/ses dışındaki her şey (sohbet, tahta, altyazı, anket, bekleme salonu) yine Supabase kanalında kalır.
// LiveKit ayarlı değilse ya da bağlanamazsa herkes herkese devam edilir.
let lkSozu = null;
const lkYukle = () => lkSozu || (lkSozu = new Promise((ok, hata) => {
  const s = el('script'); s.src = LK_URL;
  s.onload = () => ok(window.LivekitClient);
  s.onerror = () => { lkSozu = null; hata(new Error('LiveKit kütüphanesi yüklenemedi')); };
  document.head.append(s);
}));

async function sfuyaGec() {
  const c = durum.cagri;
  c.sfuDenendi = true;
  let bilet, LK;
  try {
    [bilet, LK] = await Promise.all([betikIstegi({ islem: 'livekit', oda: c.kanal, kimlik: durum.ben.id, ad: durum.ben.ad }, 10000), lkYukle()]);
  } catch (e) { console.warn('LiveKit kullanılamıyor, herkes herkese devam:', e.message); return; }
  if (durum.cagri !== c) return;
  // adaptiveStream kapalı: izler kendi <video> öğelerimizde oynuyor, LiveKit görünmez sanıp durdurmasın.
  const oda = new LK.Room({ adaptiveStream: false, dynacast: true });
  oda.on(LK.RoomEvent.TrackSubscribed, (iz, yayin, k) => sfuIzi(k, iz.mediaStreamTrack, true));
  oda.on(LK.RoomEvent.TrackUnsubscribed, (iz, yayin, k) => sfuIzi(k, iz.mediaStreamTrack, false));
  oda.on(LK.RoomEvent.ParticipantDisconnected, (k) => { if (durum.cagri === c) esKapat(k.identity); });
  oda.on(LK.RoomEvent.Disconnected, () => {
    // sunucu düşürdüyse bir sonraki eşleşmede yeniden denenir
    if (durum.cagri === c && c.sfu && c.sfu.oda === oda && !c.ayriliyor) { c.sfu = null; c.sfuDenendi = false; cagriDurumuYay(); }
  });
  try { await oda.connect(bilet.url, bilet.token); }
  catch (e) { console.warn('LiveKit bağlantısı kurulamadı:', e.message); return; }
  if (durum.cagri !== c) { oda.disconnect(false); return; }
  c.sfu = { oda, LK, ses: null, video: null, zincir: Promise.resolve() };
  for (const [id, es] of [...c.esler]) if (es.pc) esKapat(id);
  sfuYayinla();
  cagriDurumuYay();
  sfuTara();
}

// Presence gelmeden abone olunan izler bekleme salonu denetiminden geçemez; eşleşmede yeniden taranır.
function sfuTara() {
  const c = durum.cagri;
  for (const k of c.sfu.oda.remoteParticipants.values()) for (const y of k.trackPublications.values()) if (y.track) sfuIzi(k, y.track.mediaStreamTrack, true);
}

function sfuIzi(k, iz, ekle) {
  const c = durum.cagri, id = k.identity;
  if (!c || !c.sfu || !iz) return;
  if (ekle && !izinli(id, c.katilanlar.get(id))) return; // bekleme salonundaki ya da çıkarılan görünmez
  let es = c.esler.get(id);
  if (!es) {
    if (!ekle) return;
    es = { pc: null, ad: c.katilanlar.get(id)?.ad || k.name || '', akis: new MediaStream() };
    c.esler.set(id, es);
  }
  if (ekle && es.akis.getTrackById(iz.id)) return;
  es.akis.getTracks().filter((t) => t.kind === iz.kind || t === iz).forEach((t) => es.akis.removeTrack(t));
  if (!ekle) return;
  es.akis.addTrack(iz);
  karoEkle(id, es.ad, es.akis, false);
  if (iz.kind === 'audio') analizEkle(id, iz);
}

// Gönderilecek izleri (mikrofon/karışık ses, kamera/arka planlı/ekran) LiveKit yayınıyla eşitler; çağrılar sıraya girer.
function sfuYayinla() {
  const s = durum.cagri && durum.cagri.sfu;
  if (!s) return;
  s.zincir = s.zincir.then(async () => {
    const lp = s.oda.localParticipant;
    for (const [tur, iz, kaynak] of [['ses', gonderilecekSes(), s.LK.Track.Source.Microphone], ['video', gonderilecekVideo(), s.LK.Track.Source.Camera]]) {
      const y = s[tur];
      try {
        if (y && iz) { if (y.track.mediaStreamTrack !== iz) await y.track.replaceTrack(iz, { userProvidedTrack: true }); }
        else if (y) { await lp.unpublishTrack(y.track, false); s[tur] = null; }
        else if (iz) s[tur] = await lp.publishTrack(iz, { source: kaynak });
      } catch (e) { console.warn('LiveKit yayını', tur, e); }
    }
  });
  return s.zincir;
}

// ---------- cihaz seçimi ----------
function hoparloruUygula(video) {
  const id = cihazTercihi().hop;
  if (id && video.setSinkId) video.setSinkId(id).catch(() => {});
}

async function cihazlariDoldur() {
  const cihazlar = await navigator.mediaDevices.enumerateDevices();
  const t = cihazTercihi(), y = durum.cagri.yerel;
  const simdiki = { mik: y.getAudioTracks()[0]?.getSettings().deviceId, kam: y.getVideoTracks()[0]?.getSettings().deviceId, hop: t.hop };
  for (const [secim, tur, anahtar] of [['secMik', 'audioinput', 'mik'], ['secKam', 'videoinput', 'kam'], ['secHop', 'audiooutput', 'hop']]) {
    const s = $(secim);
    s.replaceChildren();
    cihazlar.filter((c) => c.kind === tur).forEach((c, i) => {
      const o = el('option', null, c.label || `${tur === 'audioinput' ? 'Mikrofon' : tur === 'videoinput' ? 'Kamera' : 'Hoparlör'} ${i + 1}`);
      o.value = c.deviceId; o.selected = c.deviceId === simdiki[anahtar];
      s.append(o);
    });
    s.disabled = !s.options.length || (tur === 'audiooutput' && !('setSinkId' in HTMLMediaElement.prototype));
    if (!s.options.length) s.append(el('option', null, 'Bulunamadı'));
  }
}

async function cihazDegistir(anahtar, deviceId) {
  const t = cihazTercihi(); t[anahtar] = deviceId;
  localStorage.setItem('ekip_cihaz', JSON.stringify(t));
  const c = durum.cagri;
  if (anahtar === 'hop') { $('sahne').querySelectorAll('.karo:not(.ben) video').forEach(hoparloruUygula); return; }
  const tur = anahtar === 'mik' ? 'audio' : 'video';
  let yeni;
  try { yeni = (await navigator.mediaDevices.getUserMedia({ [tur]: { ...(tur === 'audio' ? SES_AYAR : {}), deviceId: { exact: deviceId } } })).getTracks()[0]; }
  catch (e) { $('uyari').textContent = 'Cihaz açılamadı: ' + e.message; return; }
  const eski = tur === 'audio' ? c.yerel.getAudioTracks()[0] : c.yerel.getVideoTracks()[0];
  if (eski) { yeni.enabled = eski.enabled; c.yerel.removeTrack(eski); eski.stop(); }
  c.yerel.addTrack(yeni);
  if (tur === 'audio') { analizEkle(durum.ben.id, yeni); sesiYenile(); }
  else if (c.arka) await arkaPlanAyarla(c.arka.tur, c.arka.resim); // yeni kamerayla yeniden işle
  else videoyuYenile();
  mikKamDugmeleri();
}

function cagriDugmeleriniBagla() {
  $('ayrilDugme').onclick = () => cagridanAyril();
  $('ekranDugme').onclick = ekranPaylas;
  $('mikDugme').onclick = (e) => izAcKapa('ses', e.currentTarget);
  $('kamDugme').onclick = (e) => izAcKapa('video', e.currentTarget);
  $('elDugme').onclick = elKaldir;
  $('tepkiler').onclick = (e) => { const d = e.target.closest('button'); if (d) tepkiGonder(d.dataset.emoji); };
  $('gSohbetDugme').onclick = gSohbetAcKapa;
  $('susturHepsi').onclick = () => komutGonder('sustur', '*');
  $('secArka').onchange = (e) => arkaPlanSecildi(e.target.value);
  $('arkaResim').onchange = (e) => arkaResimYuklendi(e.target.files[0]);
  $('gSohbetForm').onsubmit = (e) => {
    e.preventDefault();
    const metin = $('gSohbetMetin').value.trim();
    if (!metin || !gonderebilir(durum.ben.id, 'sohbet')) return;
    $('gSohbetMetin').value = '';
    const m = { kimden: durum.ben.id, ad: durum.ben.ad, metin };
    durum.cagri.ch.send({ type: 'broadcast', event: 'gsohbet', payload: m });
    gSohbetEkle(m);
  };
  $('cihazDugme').onclick = async () => { $('cihazPanel').hidden = !$('cihazPanel').hidden; if (!$('cihazPanel').hidden) await cihazlariDoldur(); };
  $('secMik').onchange = (e) => cihazDegistir('mik', e.target.value);
  $('secKam').onchange = (e) => cihazDegistir('kam', e.target.value);
  $('secHop').onchange = (e) => cihazDegistir('hop', e.target.value);
  $('secIsik').onchange = (e) => {
    localStorage.setItem('ekip_isik', e.target.checked ? '1' : '0');
    const a = durum.cagri.arka;
    arkaPlanAyarla(a ? a.tur : 'yok', a && a.resim);
  };
  $('kayitDugme').onclick = () => (durum.cagri.kayit ? kayitDurdur() : kayitBaslat());
  $('altyaziDugme').onclick = () => altyaziAcKapa(!durum.cagri.altyazi, true);
  $('dokumDugme').onclick = dokumKaydet;
  $('tahtaDugme').onclick = () => tahtaAcKapa(!durum.cagri.tahta, true);
  $('ozetDugme').onclick = ozetCikar;
  $('pipDugme').onclick = pipAc;
  $('panelSekmeleri').onclick = (e) => { const b = e.target.closest('button'); if (b) panelBolumu(b.dataset.bolum); };
  $('secDuzen').onchange = (e) => { durum.cagri.duzen = e.target.value; localStorage.setItem('ekip_duzen', e.target.value); duzenUygula(); };
  $('kendimiGizle').onchange = (e) => { localStorage.setItem('ekip_kendimi_gizle', e.target.checked ? '1' : '0'); $('sahne').classList.toggle('kendimi-gizle', e.target.checked); };
  $('secCeviri').onchange = (e) => { durum.cagri.ceviri = e.target.value; };
  $('elleriIndir').onclick = () => { komutGonder('el-indir', '*'); if (durum.cagri.el) elKaldir(); };
  $('kilitDugme').onclick = () => { const c = durum.cagri; c.kilit = !c.kilit; kilitDugmesi(); cagriDurumuYay(); bekleyenleriCiz(); };
  for (const [id, tur] of [['izinSohbet', 'sohbet'], ['izinEkran', 'ekran'], ['izinTepki', 'tepki']]) {
    $(id).onchange = (e) => { durum.cagri.izinler[tur] = e.target.checked; cagriDurumuYay(); };
  }
  $('odaAc').onclick = altOdalariAc;
  $('anaOdayaDon').onclick = () => altOdayaGec(0);
  $('katilimDugme').onclick = katilimRaporu;
  // Yanlışlıkla basılmasın: ilk basış onay ister, 4 saniye içinde ikinci basış bitirir.
  $('bitirDugme').onclick = (e) => {
    const d = e.currentTarget;
    if (!d.dataset.onay) {
      d.dataset.onay = '1'; d.textContent = '⏹ Emin misin? Bir daha bas';
      setTimeout(() => { delete d.dataset.onay; d.textContent = '⏹ Herkes için bitir'; }, 4000);
      return;
    }
    komutGonder('bitir', '*');
    gorusmedenCikti('Görüşmeyi herkes için bitirdin.');
  };
  $('anketForm').onsubmit = (e) => {
    e.preventDefault();
    const secenekler = $('anketSecenek').value.split('\n').map((s) => s.trim()).filter(Boolean).slice(0, 6);
    if (secenekler.length < 2) { $('anketSecenek').setCustomValidity('En az iki seçenek yaz'); $('anketSecenek').reportValidity(); return; }
    anketBaslat($('anketSoru').value.trim(), secenekler);
    $('anketForm').reset();
  };
  $('anketSecenek').oninput = (e) => e.target.setCustomValidity('');
  $('soruForm').onsubmit = (e) => { e.preventDefault(); const m = $('soruMetin').value.trim(); if (m) { soruSor(m); $('soruMetin').value = ''; } };
  const menuyuKapat = () => { if ($('dahaMenu').matches(':popover-open')) $('dahaMenu').hidePopover(); };
  ['tahtaDugme', 'kayitDugme', 'dokumDugme', 'ozetDugme', 'cihazDugme', 'katilimDugme'].forEach((id) => $(id).addEventListener('click', menuyuKapat));
  document.addEventListener('keydown', kisayol);
  window.addEventListener('beforeunload', (e) => {
    // Kayıt sürerken kapatılırsa kayıt kaybolur: tarayıcı onay sorsun.
    if (durum.cagri && durum.cagri.kayit) { e.preventDefault(); e.returnValue = ''; return; }
    if (durum.cagri) cagridanAyril();
  });
}

// ---------- başlat ----------
async function basla() {
  if (KONUK) return konukBasla();
  durum.ben = await kimlikAl();
  if (!durum.ben) {
    if (!YEREL) return;
    $('giris').hidden = false;
    $('girisForm').onsubmit = (e) => { e.preventDefault(); sessionStorage.setItem('ekip_ad', $('girisAd').value.trim()); location.reload(); };
    return;
  }
  $('uygulama').hidden = false;
  $('ben').textContent = 'Giriş: ' + durum.ben.ad + (YEREL ? ' (yerel deneme)' : '');
  await tabloyuDene();
  lobiyeBaglan();
  $('kanalEkle').onclick = () => {
    const ad = (prompt('Yeni kanalın adı') || '').trim().toLowerCase().replace(/\s+/g, '-').slice(0, 40);
    if (ad) { kanalEkle(ad, true); kanalaGec(ad); }
  };
  $('yazma').onsubmit = (e) => { e.preventDefault(); const m = $('metin').value.trim(); if (m) { $('metin').value = ''; $('oneriler').hidden = true; gonder(m); } };
  $('metin').oninput = () => { onerileriGoster(); if ($('metin').value.trim()) yaziyorYay(); };
  $('yanitIptal').onclick = yanitIptal;
  $('ara').onkeydown = (e) => { if (e.key === 'Enter') aramaYap($('ara').value); if (e.key === 'Escape') aramaKapat(); };
  $('ara').addEventListener('search', () => { if (!$('ara').value) aramaKapat(); });
  $('durumSec').value = durum.durumum;
  $('durumSec').onchange = (e) => { durum.durumum = e.target.value; localStorage.setItem('ekip_durum', durum.durumum); lobiDurumuYay(); };
  $('cagriDugme').onclick = () => cagriyaKatil();
  $('baglantiDugme').onclick = baglantiOlustur;
  $('planDugme').onclick = planPaneliAc;
  $('planIptal').onclick = () => { $('planPanel').hidden = true; };
  $('planPanel').onsubmit = (e) => { e.preventDefault(); toplantiPlanla(); };
  $('baglantiKopyala').onclick = () => navigator.clipboard.writeText($('baglantiMetin').value).then(() => { $('baglantiKopyala').textContent = 'Kopyalandı'; });
  $('dosyaDugme').hidden = !DOSYA_URL || YEREL;
  $('dosyaDugme').onclick = () => $('dosyaSec').click();
  $('dosyaSec').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) dosyaGonder(f); };
  bildirimDugmesi();
  // Chrome/Edge kurulabilir olduğunu bildirince düğme çıkar; iPhone'da Safari → Paylaş → Ana Ekrana Ekle.
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    $('kurDugme').hidden = false;
    $('kurDugme').onclick = async () => { e.prompt(); await e.userChoice; $('kurDugme').hidden = true; };
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && durum.okunmamis.has(durum.aktif)) { durum.okunmamis.delete(durum.aktif); kanallariCiz(); sekmeBasligi(); }
    if (!document.hidden) okunduGonder();
  });
  cagriDugmeleriniBagla();
  kanalaGec('genel');
}
basla();
