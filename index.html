<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekip İletişim</title>
<link rel="icon" href="simge.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="simge-192.png">
<meta name="theme-color" content="#4f52b2">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Yerelde (localhost) ERP girişi aranmaz, ad sorulur; yayında erp-guard onaylı ERP oturumu ister.
  window.EKIP_YEREL = ['localhost', '127.0.0.1'].includes(location.hostname);
  // Görüşme bağlantısıyla gelen misafir ERP girişi olmadan yalnız o görüşmeye katılır.
  window.EKIP_KONUK = (/^[a-z0-9]{16,40}$/.exec(new URLSearchParams(location.search).get('gorusme') || '') || [null])[0];
  window.ERP_GUARD_ALLOW = () => window.EKIP_YEREL || !!window.EKIP_KONUK;
</script>
<script src="https://mycosmosshop.github.io/erp-portal/erp-guard.js"></script>
<style>
  :root {
    --zemin: #f4f5f7; --panel: #ffffff; --kenar: #dfe2e7; --yazi: #1d2129; --soluk: #6b7280;
    --vurgu: #4f52b2; --vurgu-acik: #e8e8f7; --yesil: #1f9d55; --kirmizi: #c62828; --video: #111318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --zemin: #16181d; --panel: #1f2229; --kenar: #2e323b; --yazi: #e7e9ee; --soluk: #9aa1ad;
            --vurgu: #8b8ef0; --vurgu-acik: #2b2d4a; --video: #0b0c0f; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--zemin); color: var(--yazi); height: 100vh; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--kenar); background: var(--panel); color: var(--yazi); border-radius: 6px; padding: 6px 12px; }
  button.ana { background: var(--vurgu); border-color: var(--vurgu); color: #fff; }
  button.tehlike { background: var(--kirmizi); border-color: var(--kirmizi); color: #fff; }
  button[aria-pressed="false"] { opacity: .55; }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--kenar); border-radius: 6px; background: var(--panel); color: var(--yazi); }
  #uygulama { display: grid; grid-template-columns: 250px 1fr; height: 100vh; }
  #yan { background: var(--panel); border-right: 1px solid var(--kenar); display: flex; flex-direction: column; overflow: auto; }
  #yan h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--soluk); margin: 16px 14px 6px; display: flex; justify-content: space-between; align-items: center; }
  #yan h2 button { padding: 0 8px; font-size: 16px; line-height: 22px; }
  .oge { display: flex; align-items: center; gap: 8px; padding: 6px 14px; cursor: pointer; border-radius: 6px; margin: 0 6px; }
  .oge:hover { background: var(--zemin); }
  .oge.secili { background: var(--vurgu-acik); font-weight: 600; }
  .oge .sayac { margin-left: auto; background: var(--vurgu); color: #fff; border-radius: 10px; font-size: 11px; padding: 0 7px; }
  .oge .cagri-isareti { margin-left: auto; color: var(--yesil); font-size: 12px; }
  .nokta { width: 8px; height: 8px; border-radius: 50%; background: var(--yesil); flex: none; }
  .nokta.mesgul { background: var(--kirmizi); }
  .nokta.uzakta { background: #e0a100; }
  .oge .not { margin-left: auto; color: var(--soluk); font-size: 11px; }
  #durumSec { margin: 8px 14px 0; font: inherit; padding: 4px; border: 1px solid var(--kenar); border-radius: 6px; background: var(--panel); color: var(--yazi); }
  #yaziyor { min-height: 18px; padding: 0 16px; font-size: 12px; color: var(--soluk); background: var(--panel); }
  #oneriler { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 16px 0; background: var(--panel); }
  #oneriler button { padding: 2px 10px; font-size: 13px; }
  .mesaj.bahsetme { background: var(--vurgu-acik); border-left: 3px solid var(--vurgu); padding: 4px 8px; border-radius: 4px; }
  .mesaj { position: relative; }
  .mesaj .araclar { position: absolute; right: 0; top: -8px; display: none; gap: 2px; background: var(--panel); border: 1px solid var(--kenar); border-radius: 6px; padding: 2px; }
  .mesaj:hover .araclar, .mesaj:focus-within .araclar { display: flex; }
  .mesaj .araclar button { padding: 2px 6px; border: 0; }
  .alinti { border-left: 3px solid var(--kenar); padding: 1px 8px; margin: 2px 0; color: var(--soluk); font-size: 12px; cursor: pointer; }
  .mesaj .silindi { font-style: italic; color: var(--soluk); }
  .mesaj .duzenlendi { font-size: 11px; color: var(--soluk); margin-left: 6px; }
  .mesaj .satir-form { display: flex; gap: 6px; margin-top: 2px; }
  .mesaj .satir-form input { flex: 1; min-width: 0; }
  .tepkiler { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tepkiler button { padding: 0 8px; font-size: 13px; border-radius: 12px; }
  .tepkiler button.benim { border-color: var(--vurgu); background: var(--vurgu-acik); }
  .gorenler { font-size: 11px; color: var(--soluk); margin-top: 2px; }
  .mesaj.vurgulu { animation: vurgula 2.4s ease-out; }
  @keyframes vurgula { from { background: var(--vurgu-acik); } to { background: transparent; } }
  #yanitSeridi { display: flex; gap: 8px; align-items: center; padding: 6px 16px 0; background: var(--panel); font-size: 12px; color: var(--soluk); }
  #yanitSeridi span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #yanitSeridi button { padding: 0 8px; }
  #ara { margin: 12px 14px 0; }
  .arama-sonuc { cursor: pointer; padding: 6px 8px; border-radius: 6px; }
  .arama-sonuc:hover { background: var(--panel); }
  .arama-sonuc .kanal { color: var(--vurgu); font-size: 12px; margin-right: 6px; }
  mark { background: #ffe58a; color: inherit; }
  .metin a { color: var(--vurgu); }
  .metin .etiket { color: var(--vurgu); font-weight: 600; }
  #ben { margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--kenar); color: var(--soluk); font-size: 12px; }
  #orta { display: flex; flex-direction: column; min-width: 0; }
  #baslik { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--kenar); }
  #baslik h1 { font-size: 16px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cagriBilgi { color: var(--yesil); font-size: 13px; }
  #gorusme { display: none; background: var(--video); max-height: 60vh; min-height: 0; }
  #gorusme.acik { display: flex; }
  #sahne { flex: 1; display: grid; padding: 8px; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-content: start; overflow: auto; }
  .karo { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; }
  .karo video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .karo.ben video { transform: scaleX(-1); }
  .karo.ekran video { transform: none; object-fit: contain; }
  .karo span.ad { position: absolute; left: 8px; bottom: 6px; color: #fff; background: rgba(0,0,0,.55); padding: 1px 8px; border-radius: 4px; font-size: 12px; }
  .karo { cursor: pointer; }
  .karo.buyuk { grid-column: 1 / -1; }
  .karo:fullscreen video { object-fit: contain; transform: none; }
  .karo.konusuyor { outline: 3px solid var(--yesil); outline-offset: -3px; }
  .karo .el { position: absolute; top: 6px; left: 8px; font-size: 24px; }
  .karo .tepki { position: absolute; left: 50%; bottom: 18%; font-size: 44px; pointer-events: none; animation: ucus 2.2s ease-out forwards; }
  @keyframes ucus { from { transform: translate(-50%, 0) scale(.6); opacity: 0; } 15% { transform: translate(-50%, -10%) scale(1.1); opacity: 1; } to { transform: translate(-50%, -150%); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .karo .tepki { animation: none; } }
  #bekleyenler { display: flex; flex-direction: column; gap: 4px; padding: 6px 12px; background: #2b2d4a; color: #fff; font-size: 13px; }
  .bekleyen { display: flex; gap: 8px; align-items: center; }
  .bekleyen span { flex: 1; }
  .bekleyen button { padding: 2px 10px; }
  .tahta { grid-column: 1 / -1; background: #fff; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .tahta canvas { width: 100%; aspect-ratio: 16 / 9; touch-action: none; cursor: crosshair; display: block; }
  .tahta-arac { display: flex; gap: 6px; padding: 6px; background: #eceff3; flex-wrap: wrap; align-items: center; }
  .tahta-arac button { padding: 3px 9px; background: #fff; color: #1d2129; border-color: #c9ced6; }
  .tahta-arac button.renk { width: 26px; height: 26px; border-radius: 50%; padding: 0; }
  .tahta-arac button[aria-pressed="true"] { outline: 2px solid #4f52b2; outline-offset: 1px; }
  #altyazi { background: var(--video); color: #fff; padding: 4px 16px 8px; font-size: 16px; line-height: 1.4; text-align: center; }
  #altyazi .satir span { background: rgba(0,0,0,.6); display: inline-block; padding: 2px 10px; border-radius: 4px; margin: 2px 0; }
  #altyazi b { color: #9fd3ff; margin-right: 6px; }
  #kayitSeridi { padding: 4px 12px; background: #7a1010; color: #fff; font-size: 13px; }
  #beklemeMesaji { padding: 12px 16px; background: var(--vurgu-acik); font-size: 14px; }
  .karo .yonetim { position: absolute; top: 6px; right: 6px; display: none; gap: 4px; }
  .karo:hover .yonetim, .karo:focus-within .yonetim { display: flex; }
  .karo .yonetim button { padding: 2px 6px; font-size: 12px; }
  #gSohbet { width: 280px; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--kenar); }
  #gSohbetListe { flex: 1; overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  #gSohbetListe .bilgi { color: var(--soluk); font-size: 12px; }
  #gSohbetListe b { margin-right: 4px; }
  #gSohbetForm { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--kenar); }
  #gSohbetForm input { flex: 1; min-width: 0; }
  #cagriCubugu { display: none; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 8px; background: var(--video); }
  #cagriCubugu.acik { display: flex; }
  #tepkiler { display: inline-flex; gap: 2px; }
  #tepkiler button { padding: 4px 7px; }
  #cihazPanel { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; padding: 0 8px 8px; background: var(--video); color: #fff; font-size: 13px; }
  #cihazPanel select { font: inherit; max-width: 230px; margin-left: 4px; }
  #mesajlar { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .mesaj { max-width: 70ch; }
  .mesaj .ust { font-size: 12px; color: var(--soluk); }
  .mesaj .ust b { color: var(--yazi); margin-right: 6px; }
  .mesaj .metin { white-space: pre-wrap; overflow-wrap: anywhere; }
  .bos { color: var(--soluk); margin: auto; text-align: center; }
  #yazma { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--kenar); }
  #yazma input { flex: 1; }
  #uyari { font-size: 12px; color: var(--soluk); padding: 0 16px 8px; background: var(--panel); }
  #giris { position: fixed; inset: 0; display: grid; place-items: center; background: var(--zemin); }
  #giris form { background: var(--panel); border: 1px solid var(--kenar); border-radius: 10px; padding: 24px; display: grid; gap: 12px; width: min(340px, 90vw); }
  .mesaj a.dosya { display: inline-flex; gap: 6px; align-items: center; margin-top: 2px; padding: 6px 10px; border: 1px solid var(--kenar); border-radius: 6px; color: var(--vurgu); text-decoration: none; background: var(--panel); }
  #planPanel { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; padding: 10px 16px; background: var(--vurgu-acik); font-size: 13px; }
  #planPanel label { display: grid; gap: 2px; }
  #planPanel select { font: inherit; padding: 7px; border: 1px solid var(--kenar); border-radius: 6px; background: var(--panel); color: var(--yazi); }
  .toplanti { border: 1px solid var(--kenar); border-left: 4px solid var(--vurgu); border-radius: 8px; padding: 8px 12px; background: var(--panel); max-width: 520px; }
  .toplanti strong { display: block; font-size: 15px; }
  .toplanti .zaman { color: var(--soluk); margin: 2px 0 6px; }
  .toplanti .dugmeler { display: flex; gap: 6px; flex-wrap: wrap; }
  .toplanti .dugmeler a { padding: 4px 10px; border: 1px solid var(--kenar); border-radius: 6px; text-decoration: none; color: var(--yazi); font-size: 13px; }
  .toplanti .dugmeler a.ana { background: var(--vurgu); border-color: var(--vurgu); color: #fff; }
  #baglantiKutu { display: flex; gap: 8px; align-items: center; padding: 8px 16px; background: var(--vurgu-acik); font-size: 13px; }
  #baglantiKutu input { flex: 1; min-width: 0; }
  body.konuk #yan, body.konuk #mesajlar, body.konuk #yazma, body.konuk #uyari,
  body.konuk #cagriDugme, body.konuk #baglantiDugme, body.konuk #planDugme { display: none; }
  body.konuk #uygulama { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  body.konuk #gorusme { max-height: none; flex: 1; }
  body.konuk #sahne { align-content: center; }
  #sure { color: #cfd3dc; font-size: 13px; align-self: center; min-width: 44px; font-variant-numeric: tabular-nums; }
  #dahaMenu { border: 1px solid var(--kenar); border-radius: 10px; padding: 10px; background: var(--panel); color: var(--yazi); width: min(340px, 92vw); max-height: 85vh; overflow: auto; }
  #dahaMenu:popover-open { display: grid; gap: 6px; }
  #dahaMenu label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  #dahaMenu select, #dahaMenu input[type="number"] { font: inherit; padding: 4px; }
  #sahipMenu { display: grid; gap: 6px; border-top: 1px solid var(--kenar); padding-top: 8px; }
  #sahipMenu > b { font-size: 12px; color: var(--soluk); }
  #odaListesi { display: grid; gap: 4px; font-size: 13px; }
  .satir2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #panelSekmeleri { display: flex; border-bottom: 1px solid var(--kenar); }
  #panelSekmeleri button { flex: 1; border: 0; border-radius: 0; padding: 8px 2px; font-size: 12px; background: transparent; }
  #panelSekmeleri button[aria-selected="true"] { border-bottom: 2px solid var(--vurgu); font-weight: 600; }
  #panelSekmeleri button.yeni::after { content: " •"; color: var(--kirmizi); }
  .bolum { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .liste { flex: 1; overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .liste .bilgi { color: var(--soluk); font-size: 12px; }
  .bolum form { display: grid; gap: 6px; padding: 8px; border-top: 1px solid var(--kenar); }
  .bolum textarea { font: inherit; padding: 6px; border: 1px solid var(--kenar); border-radius: 6px; background: var(--panel); color: var(--yazi); }
  .kisi { display: flex; gap: 6px; align-items: center; }
  .kisi .ad { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kisi button { padding: 1px 6px; font-size: 12px; }
  .anket, .soru { border: 1px solid var(--kenar); border-radius: 8px; padding: 8px; }
  .anket button.secenek { display: block; width: 100%; text-align: left; margin-top: 4px; position: relative; overflow: hidden; }
  .anket button.secenek .cubuk { position: absolute; inset: 0 auto 0 0; background: var(--vurgu-acik); }
  .anket button.secenek span { position: relative; }
  .anket button.secenek.benim { border-color: var(--vurgu); font-weight: 600; }
  .anket > button:last-child:not(.secenek) { margin-top: 6px; }
  .soru.cevaplandi { opacity: .55; }
  .soru .alt { display: flex; gap: 6px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--soluk); }
  .soru .alt button { padding: 1px 8px; font-size: 12px; }
  #sahne[data-duzen="spot"] { grid-template-columns: minmax(0, 1fr); }
  #sahne[data-duzen="spot"] .karo:not(.ana-karo) { display: none; }
  #sahne[data-duzen="kenar"] { grid-template-columns: minmax(0, 1fr) 200px; grid-auto-flow: row dense; }
  #sahne[data-duzen="spot"] .karo.ana-karo, #sahne[data-duzen="kenar"] .karo.ana-karo { grid-column: 1; }
  #sahne[data-duzen="kenar"] .karo.ana-karo { grid-row: span 4; }
  #sahne[data-duzen="kenar"] .karo:not(.ana-karo) { grid-column: 2; }
  #sahne.kendimi-gizle .karo.ben { display: none; }
  #altOdaBilgi { display: flex; gap: 8px; align-items: center; padding: 6px 12px; background: #24476b; color: #fff; font-size: 13px; }
  #altOdaBilgi span { flex: 1; }
  #onizleme { border: 1px solid var(--kenar); border-radius: 12px; background: var(--panel); color: var(--yazi); padding: 18px; width: min(560px, 94vw); }
  #onizleme::backdrop { background: rgba(0, 0, 0, .55); }
  #onizleme form { display: grid; gap: 10px; }
  #onizlemeVideo { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; transform: scaleX(-1); object-fit: cover; }
  #onizleme meter { width: 100%; }
  body.pip { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--video); }
  body.pip #gorusme { max-height: none; flex: 1; }
  @media (max-width: 700px) {
    #uygulama { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #yan { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--kenar); }
    #gorusme { flex-direction: column; }
    #gSohbet { width: auto; max-height: 40vh; border-left: 0; border-top: 1px solid var(--kenar); }
  }
</style>
</head>
<body>
<div id="giris" hidden>
  <form id="girisForm">
    <strong id="girisBaslik">Ekip İletişim — yerel deneme</strong>
    <label>Adın <input id="girisAd" required autocomplete="name" maxlength="60"></label>
    <button class="ana" id="girisDugme">Gir</button>
  </form>
</div>

<div id="uygulama" hidden>
  <aside id="yan">
    <input id="ara" type="search" placeholder="🔍 Mesajlarda ara" aria-label="Mesajlarda ara">
    <h2>Kanallar <button id="kanalEkle" title="Kanal ekle" aria-label="Kanal ekle">+</button></h2>
    <div id="kanalListesi"></div>
    <h2>Çevrimiçi</h2>
    <div id="kisiListesi"></div>
    <button id="bildirimDugme" hidden style="margin: 12px 14px 0">🔔 Bildirimleri aç</button>
    <button id="kurDugme" hidden style="margin: 8px 14px 0">📲 Uygulama olarak kur</button>
    <select id="durumSec" aria-label="Durumum">
      <option value="musait">🟢 Müsait</option><option value="mesgul">🔴 Meşgul (bildirim yok)</option><option value="uzakta">🟡 Uzakta</option>
    </select>
    <div id="ben"></div>
  </aside>
  <main id="orta">
    <div id="baslik">
      <h1 id="kanalAdi"></h1>
      <span id="cagriBilgi"></span>
      <button id="planDugme" title="İleri tarihli toplantı oluştur, sohbete kartını gönder">📅 Planla</button>
      <button id="baglantiDugme" title="Linke sahip olan herkes, ERP girişi olmadan bu görüşmeye katılabilir">Görüşme bağlantısı</button>
      <button id="cagriDugme" class="ana">Görüşme başlat</button>
    </div>
    <form id="planPanel" hidden>
      <label>Konu<input id="planKonu" required maxlength="120" placeholder="Haftalık kalite toplantısı"></label>
      <label>Tarih<input id="planTarih" type="date" required></label>
      <label>Saat<input id="planSaat" type="time" required></label>
      <label>Süre<select id="planSure"><option value="15">15 dk</option><option value="30" selected>30 dk</option><option value="45">45 dk</option><option value="60">1 saat</option><option value="90">1,5 saat</option><option value="120">2 saat</option></select></label>
      <label>Not<input id="planNot" maxlength="300" placeholder="Gündem (isteğe bağlı)"></label>
      <button class="ana">Oluştur ve sohbete gönder</button>
      <button type="button" id="planIptal">Vazgeç</button>
    </form>
    <div id="baglantiKutu" hidden>
      <span>Bu linki gönder:</span><input id="baglantiMetin" readonly><button id="baglantiKopyala">Kopyala</button>
    </div>
    <div id="beklemeMesaji" hidden></div>
    <div id="bekleyenler" hidden></div>
    <div id="kayitSeridi" hidden role="status"></div>
    <div id="altOdaBilgi" hidden><span id="altOdaMetin"></span><button id="anaOdayaDon">↩ Ana odaya dön</button></div>
    <div id="gorusme">
      <div id="sahne"></div>
      <aside id="gSohbet" hidden>
        <div id="panelSekmeleri" role="tablist">
          <button role="tab" data-bolum="sohbet" aria-selected="true">Sohbet</button><button role="tab" data-bolum="kisiler" aria-selected="false">Kişiler</button><button role="tab" data-bolum="anket" aria-selected="false">Anket</button><button role="tab" data-bolum="soru" aria-selected="false">Soru-Cevap</button>

<script>
const SUPA_URL = 'https://chchaielttnimuuezazb.supabase.co';
const SUPA_KEY = 'sb_publishable_S2ywbq7TkgcZKiVif3td-A_oAuQL3QT';
const YEREL = window.EKIP_YEREL;
const KONUK = window.EKIP_KONUK;
// Apps Script web uygulaması (ekip_dosya.gs): Drive yükleme, TURN kimliği, LiveKit bileti, Claude özeti/çevirisi.
const DOSYA_URL = 'https://script.google.com/macros/s/AKfycbwbifiyemlR4HeYOOfmG76_iYxJDQ6wtVBfXcNQrQK7ODAr6AS7ApkY1L-kZ6x2H8s-9w/exec';
const TEK_PARCA = 20 * 1024 * 1024;        // altı tek istekte, üstü parça parça yüklenir
const PARCA = 8 * 1024 * 1024;             // Drive devam ettirilebilir yükleme: 256 KB'nin katı olmalı
const DOSYA_SINIR = 2 * 1024 * 1024 * 1024;
// Yayında kanallar özel (RLS: kurulum.sql); yerelde tablo/politika yokken deneme için açık kanal.
const OZEL = !YEREL;
// TURN (Cloudflare) Apps Script'ten alınamazsa yedek: yalnız STUN, aynı ağda ve çoğu ev ağında yeter.
const ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
const GECMIS = 200;
// Bu kişi sayısından itibaren görüntü/ses LiveKit sunucusundan (SFU) akar; altında herkes herkese bağlanır.
// Yerelde ?sfu ile 2 kişide denenebilir.
const KALABALIK = YEREL && new URLSearchParams(location.search).has('sfu') ? 2 : 7;
const LK_URL = 'https://cdn.jsdelivr.net/npm/livekit-client@2.22.4/dist/livekit-client.umd.js';

const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
// Küçük pencere açıkken görüşme öğeleri o pencerenin belgesine taşınır; aramalar iki belgeye de bakar.
let pipPencere = null, pipYeri = null;
const $ = (id) => document.getElementById(id) || (pipPencere && pipPencere.document.getElementById(id));
const karo = (id) => $('sahne').querySelector(`.karo[data-id="${CSS.escape(id)}"]`);
const indir = (blob, ad) => { const a = el('a'); a.href = URL.createObjectURL(blob); a.download = ad; document.body.append(a); a.click(); a.remove(); };
const mmss = (sn) => (sn >= 3600 ? Math.floor(sn / 3600) + ':' : '') + String(Math.floor(sn / 60) % 60).padStart(2, '0') + ':' + String(sn % 60).padStart(2, '0');
const el = (etiket, sinif, metin) => { const e = document.createElement(etiket); if (sinif) e.className = sinif; if (metin != null) e.textContent = metin; return e; };

const durum = {
  ben: null,                 // {id, ad}
  kanallar: new Set(JSON.parse(localStorage.getItem('ekip_kanallar') || '["genel"]')),
  aktif: 'genel',
  mesajlar: new Map(),       // kanal → [mesaj]
  okunmamis: new Map(),
  cevrimici: new Map(),      // id → {ad, cagri}
  dmAdlari: new Map(),       // dm kanalı → karşı tarafın adı
  tabloVar: false,
  lobi: null, kutu: null, kutular: new Map(),
  cagri: null,
  durumum: localStorage.getItem('ekip_durum') || 'musait',
  yazanlar: new Map(),       // kanal → Map(id → {ad, zaman})
  tepkiler: new Map(),       // mesaj id → Map(emoji → Map(kullanıcı → ad))
  okundu: new Map(),         // kanal → Map(kullanıcı → {ad, son})
  benimOkundu: new Map(),    // kanal → gönderdiğim son okuma zamanı
  yanitlanan: null, duzenlenen: null, silinecek: null,
  arama: null,               // {q, sonuc}
};
const MESAJ_TEPKILERI = ['👍', '❤️', '😂', '😮', '😢', '🙏'];

// ---------- kimlik ----------
async function kimlikAl() {
  if (YEREL || KONUK) {
    const ad = new URLSearchParams(location.search).get('ad') || sessionStorage.getItem('ekip_ad');
    if (!ad) return null;
    let id = sessionStorage.getItem('ekip_id');
    if (!id) { id = crypto.randomUUID(); sessionStorage.setItem('ekip_id', id); }
    sessionStorage.setItem('ekip_ad', ad);
    return { id, ad, konuk: !!KONUK };
  }
  return erpKimligi(); // oturum yoksa erp-guard zaten portala yönlendirir
}

// Onaylı ERP oturumu varsa kimlik; yoksa null. Görüşme bağlantısıyla gelen ERP kullanıcısı da bununla tanınır.
async function erpKimligi() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return null;
  const { data: satir } = await sb.from('erp_users').select('*').eq('id', session.user.id).maybeSingle();
  if (!satir || !satir.approved) return null;
  const ad = ['ad_soyad', 'full_name', 'ad', 'name'].map((k) => satir[k]).find(Boolean) || session.user.email.split('@')[0];
  return { id: session.user.id, ad, konuk: false };
}

// ---------- kanallar ve mesajlar ----------
const dmKanal = (a, b) => 'dm:' + [a, b].sort().join(':');
const kanalBasligi = (k) => (k.startsWith('dm:') ? (durum.dmAdlari.get(k) || 'Birebir sohbet') : '# ' + k);

function kanalEkle(k, yay) {
  if (k.startsWith('dm:') || durum.kanallar.has(k)) return;
  durum.kanallar.add(k);
  localStorage.setItem('ekip_kanallar', JSON.stringify([...durum.kanallar]));
  if (yay) lobiDurumuYay();
  kanallariCiz();
}

function mesajAl(m, sessiz) {
  const liste = durum.mesajlar.get(m.kanal) || [];
  if (liste.some((x) => x.id === m.id)) return;
  liste.push(m); liste.sort((a, b) => zaman(a.olusma) - zaman(b.olusma));
  durum.mesajlar.set(m.kanal, liste);
  if (m.kanal.startsWith('dm:') && m.yazar_id !== durum.ben.id) durum.dmAdlari.set(m.kanal, m.yazar_ad);
  else kanalEkle(m.kanal, false);
  const baskasi = m.yazar_id !== durum.ben.id;
  durum.yazanlar.get(m.kanal)?.delete(m.yazar_id);
  if (m.kanal === durum.aktif) yaziyorCiz();
  if (m.kanal === durum.aktif && !document.hidden) mesajlariCiz();
  else if (baskasi) {
    durum.okunmamis.set(m.kanal, (durum.okunmamis.get(m.kanal) || 0) + 1); kanallariCiz();
    if (m.kanal === durum.aktif) mesajlariCiz();
  }
  if (baskasi && !sessiz) bildir(m.kanal.startsWith('dm:') ? m.yazar_ad : `${m.yazar_ad} · ${kanalBasligi(m.kanal)}`, m.dosya ? '📎 ' + m.dosya.ad : m.metin, m.kanal, bahsedildiMi(m));
  sekmeBasligi();
}

// ---------- @bahsetme, bağlantılar ----------
const kucuk = (s) => String(s).toLocaleLowerCase('tr-TR');
const bahsedildiMi = (m) => !!m.metin && kucuk(m.metin).includes('@' + kucuk(durum.ben.ad));

function bilinenAdlar() {
  const adlar = new Set([durum.ben.ad, ...[...durum.cevrimici.values()].map((k) => k.ad)]);
  (durum.mesajlar.get(durum.aktif) || []).forEach((m) => adlar.add(m.yazar_ad));
  return [...adlar].filter(Boolean).sort((a, b) => b.length - a.length);
}

// Metni güvenle parçalar: URL'ler bağlantı, bilinen adlara yapılan @bahsetmeler vurgulu olur.
function metniCiz(metin) {
  const kap = el('div', 'metin');
  const adlar = bilinenAdlar();
  for (const parca of metin.split(/(https?:\/\/[^\s<>"]+)/)) {
    if (/^https?:\/\//.test(parca)) {
      const a = el('a', null, parca); a.href = parca; a.target = '_blank'; a.rel = 'noopener noreferrer';
      kap.append(a); continue;
    }
    let kalan = parca;
    while (kalan) {
      const i = kalan.indexOf('@');
      const ad = i < 0 ? null : adlar.find((x) => kucuk(kalan.slice(i + 1, i + 1 + x.length)) === kucuk(x));
      if (!ad) { kap.append(kalan); break; }
      kap.append(kalan.slice(0, i), el('span', 'etiket', '@' + ad));
      kalan = kalan.slice(i + 1 + ad.length);
    }
  }
  return kap;
}

function onerileriGoster() {
  const giris = $('metin'), once = giris.value.slice(0, giris.selectionStart);
  const es = /@([^\s@]{0,20})$/.exec(once);
  const kutu = $('oneriler');
  if (!es) { kutu.hidden = true; return; }
  const adaylar = bilinenAdlar().filter((a) => a !== durum.ben.ad && kucuk(a).startsWith(kucuk(es[1]))).slice(0, 6);
  kutu.replaceChildren(...adaylar.map((a) => {
    const d = el('button', null, '@' + a); d.type = 'button';
    d.onclick = () => {
      const bas = once.length - es[0].length;
      giris.value = giris.value.slice(0, bas) + '@' + a + ' ' + giris.value.slice(giris.selectionStart);
      kutu.hidden = true; giris.focus();
    };
    return d;
  }));
  kutu.hidden = !adaylar.length;
}

// ---------- yazıyor göstergesi ----------
const karsiTaraf = (k) => k.slice(3).split(':').find((x) => x !== durum.ben.id);

// Birebir olaylar karşı tarafın kişisel kanalına gider; kanal açık tutulur, katılım bitene kadar gelenler sıraya alınır.
function kutuyaGonder(kime, olay, veri) {
  let k = durum.kutular.get(kime);
  if (!k) {
    k = { ch: sb.channel('ekip-kutu:' + kime, { config: { private: OZEL } }), hazir: false, sira: [] };
    k.ch.subscribe((s) => {
      if (s !== 'SUBSCRIBED') return;
      k.hazir = true;
      k.sira.splice(0).forEach(([o, v]) => k.ch.send({ type: 'broadcast', event: o, payload: v }));
    });
    durum.kutular.set(kime, k);
  }
  if (k.hazir) k.ch.send({ type: 'broadcast', event: olay, payload: veri });
  else k.sira.push([olay, veri]);
}

let sonYaziyor = 0;
function yaziyorYay() {
  if (Date.now() - sonYaziyor < 2500) return;
  sonYaziyor = Date.now();
  const p = { kanal: durum.aktif, id: durum.ben.id, ad: durum.ben.ad };
  if (durum.aktif.startsWith('dm:')) kutuyaGonder(karsiTaraf(durum.aktif), 'yaziyor', p);
  else durum.lobi.send({ type: 'broadcast', event: 'yaziyor', payload: p });
}

function yaziyorAl(p) {
  if (p.id === durum.ben.id) return;
  const m = durum.yazanlar.get(p.kanal) || new Map();
  m.set(p.id, { ad: p.ad, zaman: Date.now() });
  durum.yazanlar.set(p.kanal, m);
  yaziyorCiz();
  setTimeout(yaziyorCiz, 4100);
}

function yaziyorCiz() {
  const m = durum.yazanlar.get(durum.aktif), simdi = Date.now();
  const adlar = m ? [...m.values()].filter((x) => simdi - x.zaman < 4000).map((x) => x.ad) : [];
  $('yaziyor').textContent = adlar.length ? `${adlar.join(', ')} yazıyor…` : '';
}

async function gecmisYukle(kanal) {
  if (!durum.tabloVar) return;
  const { data, error } = await sb.from('ekip_mesaj').select('*').eq('kanal', kanal).order('olusma', { ascending: false }).limit(GECMIS);
  if (error) return;
  data.reverse().forEach((m) => mesajAl(m, true));
  const [tepki, okundu] = await Promise.all([
    data.length ? sb.from('ekip_tepki').select('*').in('mesaj_id', data.map((m) => m.id)).eq('aktif', true) : { data: [] },
    sb.from('ekip_okundu').select('*').eq('kanal', kanal),
  ]);
  (tepki.data || []).forEach((t) => tepkiAl(t, true));
  (okundu.data || []).forEach((o) => okunduAl(o, true));
}

// Kanal olayını o kanalı görenlere yayar: birebirde karşı tarafın kişisel kanalına, diğerlerinde lobiye.
function kanalaYay(kanal, olay, veri) {
  if (kanal.startsWith('dm:')) kutuyaGonder(karsiTaraf(kanal), olay, veri);
  else durum.lobi.send({ type: 'broadcast', event: olay, payload: veri });
}

// ---------- mesaj düzenleme, silme, tepki ----------
async function mesajDegistir(m, degisim) {
  const g = { id: m.id, kanal: m.kanal, yazar_id: m.yazar_id, duzenlendi: new Date().toISOString(),
              metin: degisim.silindi ? '' : degisim.metin, silindi: !!degisim.silindi };
  mesajGuncelAl(g);
  if (durum.tabloVar) {
    const alanlar = { metin: g.metin, silindi: g.silindi, duzenlendi: g.duzenlendi };
    if (g.silindi) alanlar.dosya = null;
    const { error } = await sb.from('ekip_mesaj').update(alanlar).eq('id', m.id);
    if (error) $('uyari').textContent = 'Değişiklik kaydedilemedi: ' + error.message;
  } else kanalaYay(m.kanal, 'mesaj-guncel', g);
}

function mesajGuncelAl(g) {
  const m = (durum.mesajlar.get(g.kanal) || []).find((x) => x.id === g.id);
  if (!m || g.yazar_id !== m.yazar_id) return;
  Object.assign(m, { metin: g.metin, silindi: !!g.silindi, duzenlendi: g.duzenlendi });
  if (g.silindi) m.dosya = null;
  if (g.kanal === durum.aktif) mesajlariCiz();
}

async function tepkiDegistir(m, emoji) {
  const vardi = !!durum.tepkiler.get(m.id)?.get(emoji)?.has(durum.ben.id);
  const t = { mesaj_id: m.id, kanal: m.kanal, kullanici_id: durum.ben.id, ad: durum.ben.ad, emoji, aktif: !vardi };
  tepkiAl(t);
  if (durum.tabloVar) {
    const { error } = await sb.from('ekip_tepki').upsert({ mesaj_id: m.id, emoji, ad: t.ad, aktif: t.aktif, guncel: new Date().toISOString() }, { onConflict: 'mesaj_id,kullanici_id,emoji' });
    if (error) $('uyari').textContent = 'Tepki kaydedilemedi: ' + error.message;
  } else kanalaYay(m.kanal, 'mtepki', t);
}

function tepkiAl(t, sessiz) {
  if (!MESAJ_TEPKILERI.includes(t.emoji)) return;
  const e = durum.tepkiler.get(t.mesaj_id) || new Map(), k = e.get(t.emoji) || new Map();
  if (t.aktif) k.set(t.kullanici_id, t.ad); else k.delete(t.kullanici_id);
  e.set(t.emoji, k); durum.tepkiler.set(t.mesaj_id, e);
  if (!sessiz && (durum.mesajlar.get(durum.aktif) || []).some((m) => m.id === t.mesaj_id)) mesajlariCiz();
}

// ---------- okundu bilgisi ----------
async function okunduGonder() {
  const k = durum.aktif, liste = durum.mesajlar.get(k) || [];
  const son = liste.length && liste[liste.length - 1].olusma;
  if (!son || document.hidden || zaman(durum.benimOkundu.get(k) || 0) >= zaman(son)) return;
  durum.benimOkundu.set(k, son);
  const o = { kanal: k, kullanici_id: durum.ben.id, ad: durum.ben.ad, son };
  if (durum.tabloVar) await sb.from('ekip_okundu').upsert({ kanal: k, ad: o.ad, son }, { onConflict: 'kullanici_id,kanal' });
  else kanalaYay(k, 'okundu', o);
}

function okunduAl(o, sessiz) {
  const m = durum.okundu.get(o.kanal) || new Map();
  const onceki = m.get(o.kullanici_id);
  if (onceki && zaman(onceki.son) >= zaman(o.son)) return;
  m.set(o.kullanici_id, { ad: o.ad, son: o.son });
  durum.okundu.set(o.kanal, m);
  if (!sessiz && o.kanal === durum.aktif) mesajlariCiz();
}

// ---------- arama ----------
async function aramaYap(q) {
  q = q.trim();
  if (q.length < 2) return aramaKapat();
  let sonuc;
  if (durum.tabloVar) {
    const desen = '%' + q.replace(/[%_\\]/g, '\\$&') + '%';
    const { data, error } = await sb.from('ekip_mesaj').select('*').ilike('metin', desen).eq('silindi', false).order('olusma', { ascending: false }).limit(50);
    if (error) { $('uyari').textContent = 'Arama yapılamadı: ' + error.message; return; }
    sonuc = data;
  } else {
    sonuc = [...durum.mesajlar.values()].flat().filter((m) => !m.silindi && kucuk(m.metin).includes(kucuk(q)))
      .sort((a, b) => b.olusma.localeCompare(a.olusma)).slice(0, 50);
  }
  durum.arama = { q, sonuc };
  mesajlariCiz();
}

function aramaKapat() { durum.arama = null; $('ara').value = ''; basligiCiz(); mesajlariCiz(); }

// ---------- toplantı planlama ----------
// Planlanan toplantı bir misafir görüşme bağlantısıdır; kart sohbete düşer, herkes kendi takvimine ekler.
const gorusmeLinkiMi = (u) => typeof u === 'string' && /^\?gorusme=[a-z0-9]{16,40}$/.test(u.slice((location.origin + location.pathname).length)) && u.startsWith(location.origin + location.pathname);
const takvimZamani = (iso) => new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); // 20261024T110000Z
const icsMetni = (s) => String(s).replace(/[\\;,]/g, '\\$&').replace(/\n/g, '\\n');

function planPaneliAc() {
  const yarin = new Date(Date.now() + 86400000);
  $('planTarih').value = yarin.toISOString().slice(0, 10);
  $('planSaat').value = '10:00';
  $('planPanel').hidden = false;
  $('planKonu').focus();
}

async function toplantiPlanla() {
  const bas = new Date(`${$('planTarih').value}T${$('planSaat').value}`);
  if (isNaN(bas)) return;
  const bit = new Date(bas.getTime() + Number($('planSure').value) * 60000);
  const kod = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(36).padStart(2, '0')).join('').slice(0, 20);
  const t = { konu: $('planKonu').value.trim(), bas: bas.toISOString(), bit: bit.toISOString(), not: $('planNot').value.trim(),
              link: `${location.origin}${location.pathname}?gorusme=${kod}` };
  $('planPanel').hidden = true; $('planPanel').reset();
  await gonder(`📅 ${t.konu} · ${tarihYaz(t.bas)}`, null, { toplanti: t });
}

function toplantiKarti(t) {
  const k = el('div', 'toplanti');
  const gun = new Date(t.bas).toLocaleString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  const bitis = new Date(t.bit).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  const bitti = Date.now() > zaman(t.bit);
  k.append(el('strong', null, '📅 ' + t.konu), el('div', 'zaman', `${gun} – ${bitis}${bitti ? ' · bitti' : ''}`));
  if (t.not) k.append(el('div', 'metin', t.not));
  const d = el('div', 'dugmeler');
  const bag = (yazi, href, sinif, indir) => { const a = el('a', sinif || null, yazi); a.href = href; a.target = '_blank'; a.rel = 'noopener'; if (indir) a.download = indir; d.append(a); };
  const aciklama = (t.not ? t.not + '\n\n' : '') + 'Katılmak için: ' + t.link;
  if (gorusmeLinkiMi(t.link) && !bitti) bag('Katıl', t.link, 'ana');
  bag('Google Takvim', `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t.konu)}&dates=${takvimZamani(t.bas)}/${takvimZamani(t.bit)}&details=${encodeURIComponent(aciklama)}&location=${encodeURIComponent(t.link)}`);
  bag('Outlook', `https://outlook.office.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(t.konu)}&startdt=${encodeURIComponent(t.bas)}&enddt=${encodeURIComponent(t.bit)}&body=${encodeURIComponent(aciklama)}&location=${encodeURIComponent(t.link)}`);
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ekip Iletisim//TR', 'BEGIN:VEVENT',
    `UID:${t.link.split('=').pop()}@ekip-iletisim`, `DTSTAMP:${takvimZamani(new Date().toISOString())}`,
    `DTSTART:${takvimZamani(t.bas)}`, `DTEND:${takvimZamani(t.bit)}`, `SUMMARY:${icsMetni(t.konu)}`,
    `DESCRIPTION:${icsMetni(aciklama)}`, `LOCATION:${icsMetni(t.link)}`, `URL:${t.link}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  bag('.ics', URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })), null, t.konu.replace(/[\\/:*?"<>|]/g, '') + '.ics');
  k.append(d);
  return k;
}

function aramaCiz(kok) {
  const { q, sonuc } = durum.arama;
  $('kanalAdi').textContent = `Arama: "${q}" · ${sonuc.length} sonuç`;
  const kapat = el('button', null, '✕ Aramayı kapat'); kapat.onclick = aramaKapat;
  kok.append(kapat);
  if (!sonuc.length) kok.append(el('div', 'bos', 'Sonuç yok.'));
  for (const m of sonuc) {
    const d = el('div', 'arama-sonuc');
    const ust = el('div', 'ust');
    ust.append(el('span', 'kanal', kanalBasligi(m.kanal)), el('b', null, m.yazar_ad + ' '), document.createTextNode(new Date(m.olusma).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' })));
    const metin = el('div', 'metin'), i = kucuk(m.metin).indexOf(kucuk(q));
    if (i < 0) metin.textContent = m.metin;
    else metin.append(m.metin.slice(0, i), el('mark', null, m.metin.slice(i, i + q.length)), m.metin.slice(i + q.length));
    d.append(ust, metin);
    d.onclick = async () => {
      if (m.kanal.startsWith('dm:') && !durum.dmAdlari.has(m.kanal)) durum.dmAdlari.set(m.kanal, m.yazar_id === durum.ben.id ? 'Birebir sohbet' : m.yazar_ad);
      durum.arama = null; $('ara').value = '';
      mesajAl(m, true);
      await kanalaGec(m.kanal);
      mesajaGit(m.id);
    };
    kok.append(d);
  }
}

function mesajaGit(id) {
  const d = document.querySelector(`#mesajlar .mesaj[data-id="${id}"]`);
  if (!d) return;
  d.scrollIntoView({ block: 'center' });
  d.classList.remove('vurgulu'); void d.offsetWidth; d.classList.add('vurgulu');
}

// ---------- bildirim ----------
function bildir(baslik, govde, kanal, onemli) {
  if (!document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
  if (durum.durumum === 'mesgul' && !onemli) return; // meşgulken yalnız @bahsetme bildirimi gelir
  if (onemli) baslik = '@ ' + baslik;
  const n = new Notification(baslik, { body: govde.slice(0, 200), tag: kanal });
  n.onclick = () => { window.focus(); kanalaGec(kanal); n.close(); };
}
function sekmeBasligi() {
  const toplam = [...durum.okunmamis.values()].reduce((a, b) => a + b, 0);
  document.title = (toplam ? `(${toplam}) ` : '') + 'Ekip İletişim';
}
function bildirimDugmesi() {
  const izin = 'Notification' in window ? Notification.permission : 'denied';
  const d = $('bildirimDugme');
  d.hidden = izin !== 'default';
  d.onclick = async () => { await Notification.requestPermission(); bildirimDugmesi(); };
}

async function tabloyuDene() {
  // Yerel denemede ERP oturumu yok: tablo RLS'e takılır, anlık yayın kullanılır.
  const { error } = YEREL ? { error: true } : await sb.from('ekip_mesaj').select('id').limit(1);
  durum.tabloVar = !error;
  $('uyari').textContent = durum.tabloVar ? '' : 'Mesaj geçmişi kapalı: mesajlar yalnız açık olanlara anlık gider, sayfa yenilenince kaybolur (kurulum.sql çalıştırılınca açılır).';
}

async function gonder(metin, dosya, ek) {
  const m = { id: crypto.randomUUID(), kanal: durum.aktif, yazar_id: durum.ben.id, yazar_ad: durum.ben.ad, metin, dosya: dosya || null,
              yanit: durum.yanitlanan, toplanti: (ek && ek.toplanti) || null, olusma: new Date().toISOString() };
  yanitIptal();
  mesajAl(m);
  if (durum.tabloVar) {
    // Tablo varken mesaj yalnız veritabanından dağıtılır: RLS kimin göreceğine karar verir.
    const { error } = await sb.from('ekip_mesaj').insert({ id: m.id, kanal: m.kanal, yazar_ad: m.yazar_ad, metin: m.metin, dosya: m.dosya, yanit: m.yanit, toplanti: m.toplanti });
    if (error) $('uyari').textContent = 'Mesaj gönderilemedi: ' + error.message;
    return;
  }
  if (m.kanal.startsWith('dm:')) kutuyaGonder(karsiTaraf(m.kanal), 'mesaj', m);
  else durum.lobi.send({ type: 'broadcast', event: 'mesaj', payload: m });
}

// ---------- çizim ----------
function kanallariCiz() {
  const kok = $('kanalListesi'); kok.replaceChildren();
  const cagridakiler = cagriSayilari();
  const tum = [...durum.kanallar, ...durum.dmAdlari.keys()];
  for (const k of tum) {
    const o = el('div', 'oge' + (k === durum.aktif ? ' secili' : ''), kanalBasligi(k));
    if (cagridakiler.get(k)) o.append(el('span', 'cagri-isareti', '● görüşme ' + cagridakiler.get(k)));
    else if (durum.okunmamis.get(k)) o.append(el('span', 'sayac', durum.okunmamis.get(k)));
    o.onclick = () => kanalaGec(k);
    kok.append(o);
  }
}

function kisileriCiz() {
  const kok = $('kisiListesi'); kok.replaceChildren();
  for (const [id, k] of durum.cevrimici) {
    if (id === durum.ben.id) continue;
    const o = el('div', 'oge'); o.append(el('span', 'nokta ' + k.durum), el('span', null, k.ad));
    const not = k.cagri ? 'görüşmede' : { mesgul: 'meşgul', uzakta: 'uzakta' }[k.durum];
    if (not) o.append(el('span', 'not', not));
    o.title = 'Birebir sohbet aç';
    o.onclick = () => { const dk = dmKanal(durum.ben.id, id); durum.dmAdlari.set(dk, k.ad); kanalaGec(dk); };
    kok.append(o);
  }
  if (kok.children.length === 0) kok.append(el('div', 'oge', 'Şu an kimse yok'));
}

const zaman = (t) => Date.parse(t);
const tarihYaz = (t) => new Date(t).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' });

function mesajlariCiz() {
  const kok = $('mesajlar');
  const alttaydi = kok.scrollHeight - kok.scrollTop - kok.clientHeight < 60, eski = kok.scrollTop;
  kok.replaceChildren();
  if (durum.arama) return aramaCiz(kok);
  const liste = durum.mesajlar.get(durum.aktif) || [];
  if (!liste.length) kok.append(el('div', 'bos', 'Henüz mesaj yok. İlk mesajı sen yaz.'));
  const benimSon = [...liste].reverse().find((m) => m.yazar_id === durum.ben.id && !m.silindi);
  for (const m of liste) kok.append(mesajCiz(m, m === benimSon));
  kok.scrollTop = alttaydi ? kok.scrollHeight : eski; // okurken yukarıdaysa yerinden oynatma
  okunduGonder();
}

function mesajCiz(m, benimSon) {
  const benim = m.yazar_id === durum.ben.id;
  const d = el('div', 'mesaj' + (!benim && bahsedildiMi(m) ? ' bahsetme' : ''));
  d.dataset.id = m.id;
  if (m.yanit && !m.silindi) {
    const a = el('div', 'alinti', `↩ ${m.yanit.ad}: ${m.yanit.metin}`);
    a.onclick = () => mesajaGit(m.yanit.id);
    d.append(a);
  }
  const ust = el('div', 'ust');
  ust.append(el('b', null, m.yazar_ad), document.createTextNode(tarihYaz(m.olusma)));
  if (m.duzenlendi && !m.silindi) ust.append(el('span', 'duzenlendi', '(düzenlendi)'));
  d.append(ust);
  if (m.silindi) d.append(el('div', 'metin silindi', 'Bu mesaj silindi'));
  else if (durum.duzenlenen === m.id) {
    d.append(satirFormu(m.metin, 'Kaydet', (yeni) => {
      durum.duzenlenen = null;
      if (yeni && yeni !== m.metin) mesajDegistir(m, { metin: yeni }); else mesajlariCiz();
    }));
  } else if (m.toplanti) d.append(toplantiKarti(m.toplanti));
  else if (m.dosya && /^https:\/\/drive\.google\.com\//.test(m.dosya.url)) {
    const a = el('a', 'dosya', `📎 ${m.dosya.ad} · ${boyutYaz(m.dosya.boyut)}`);
    a.href = m.dosya.url; a.target = '_blank'; a.rel = 'noopener';
    d.append(a);
  } else d.append(metniCiz(m.metin));
  if (durum.silinecek === m.id) {
    const onay = el('div', 'satir-form'), evet = el('button', 'tehlike', 'Sil'), hayir = el('button', null, 'Vazgeç');
    evet.onclick = () => { durum.silinecek = null; mesajDegistir(m, { silindi: true }); };
    hayir.onclick = () => { durum.silinecek = null; mesajlariCiz(); };
    onay.append(el('span', null, 'Bu mesaj silinsin mi?'), evet, hayir);
    d.append(onay);
  }
  const tepkiler = durum.tepkiler.get(m.id);
  if (tepkiler && !m.silindi) {
    const kutu = el('div', 'tepkiler');
    for (const [emoji, kisiler] of tepkiler) {
      if (!kisiler.size) continue;
      const b = el('button', kisiler.has(durum.ben.id) ? 'benim' : '', `${emoji} ${kisiler.size}`);
      b.title = [...kisiler.values()].join(', ');
      b.onclick = () => tepkiDegistir(m, emoji);
      kutu.append(b);
    }
    if (kutu.children.length) d.append(kutu);
  }
  if (benimSon) { const g = gorenlerMetni(m); if (g) d.append(el('div', 'gorenler', g)); }
  if (!m.silindi) d.append(mesajAraclari(m, benim));
  return d;
}

function mesajAraclari(m, benim) {
  const a = el('div', 'araclar');
  const dugme = (yazi, baslik, fn) => { const b = el('button', null, yazi); b.title = baslik; b.setAttribute('aria-label', baslik); b.onclick = fn; a.append(b); };
  dugme('↩', 'Yanıtla', () => yanitla(m));
  MESAJ_TEPKILERI.forEach((e) => dugme(e, 'Tepki ver: ' + e, () => tepkiDegistir(m, e)));
  if (benim && !m.dosya && !m.toplanti) dugme('✏️', 'Düzenle', () => { durum.duzenlenen = m.id; mesajlariCiz(); });
  if (benim) dugme('🗑️', 'Sil', () => { durum.silinecek = m.id; mesajlariCiz(); });
  return a;
}

function satirFormu(deger, etiket, bitti) {
  const f = el('form', 'satir-form'), g = el('input'), k = el('button', 'ana', etiket), v = el('button', null, 'Vazgeç');
  g.value = deger; g.maxLength = 4000; v.type = 'button';
  f.onsubmit = (e) => { e.preventDefault(); bitti(g.value.trim()); };
  v.onclick = () => bitti(null);
  g.onkeydown = (e) => { if (e.key === 'Escape') bitti(null); };
  f.append(g, k, v);
  setTimeout(() => g.focus(), 0);
  return f;
}

function gorenlerMetni(m) {
  const o = durum.okundu.get(m.kanal);
  if (!o) return '';
  const adlar = [...o.entries()].filter(([id, x]) => id !== durum.ben.id && zaman(x.son) >= zaman(m.olusma)).map(([, x]) => x.ad);
  if (!adlar.length) return '';
  if (m.kanal.startsWith('dm:')) return '✓ Görüldü';
  return 'Görenler: ' + adlar.slice(0, 5).join(', ') + (adlar.length > 5 ? ` +${adlar.length - 5}` : '');
}

function yanitla(m) {
  durum.yanitlanan = { id: m.id, ad: m.yazar_ad, metin: (m.dosya ? '📎 ' + m.dosya.ad : m.metin).slice(0, 100) };
  $('yanitMetin').textContent = `↩ ${m.yazar_ad}: ${durum.yanitlanan.metin}`;
  $('yanitSeridi').hidden = false;
  $('metin').focus();
}
function yanitIptal() { durum.yanitlanan = null; $('yanitSeridi').hidden = true; }

function basligiCiz() {
  if (KONUK) { $('kanalAdi').textContent = 'Görüşme'; return; }
  $('kanalAdi').textContent = kanalBasligi(durum.aktif);
  const n = cagriSayilari().get(durum.aktif) || 0;
  const bende = durum.cagri && durum.cagri.kanal === durum.aktif;
  const misafirde = durum.cagri && durum.cagri.kanal.startsWith('misafir-');
  $('cagriBilgi').textContent = misafirde ? 'Bağlantılı görüşmedesin' : n && !bende ? `Görüşme sürüyor · ${n} kişi` : '';
  $('cagriDugme').hidden = !!durum.cagri;
  $('baglantiDugme').hidden = !!durum.cagri;
  $('cagriDugme').textContent = n ? 'Görüşmeye katıl' : 'Görüşme başlat';
}

const boyutYaz = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');

async function kanalaGec(k) {
  durum.aktif = k; durum.okunmamis.delete(k);
  durum.arama = null; durum.duzenlenen = durum.silinecek = null; yanitIptal(); yaziyorCiz();
  kanallariCiz(); basligiCiz(); mesajlariCiz(); sekmeBasligi();
  await gecmisYukle(k);
  mesajlariCiz();
}

// ---------- lobi (çevrimiçi + anlık mesaj) ----------
function cagriSayilari() {
  const say = new Map();
  for (const k of durum.cevrimici.values()) if (k.cagri) say.set(k.cagri, (say.get(k.cagri) || 0) + 1);
  return say;
}

function lobiDurumuYay() {
  if (!durum.lobi) return;
  const k = durum.cagri && (durum.cagri.anaKanal || durum.cagri.kanal); // alt odadayken ana kanal görünür
  const cagri = k && !k.startsWith('misafir-') ? k : null;
  durum.lobi.track({ ad: durum.ben.ad, cagri, kanallar: [...durum.kanallar], durum: durum.durumum });
}

function lobiyeBaglan() {
  const ch = sb.channel('ekip-lobi', { config: { presence: { key: durum.ben.id }, broadcast: { self: false }, private: OZEL } });
  let oncekiCagrilar = new Map();
  ch.on('presence', { event: 'sync' }, () => {
    durum.cevrimici.clear();
    for (const [id, girisler] of Object.entries(ch.presenceState())) {
      const g = girisler[girisler.length - 1];
      durum.cevrimici.set(id, { ad: g.ad, cagri: girisler.map((x) => x.cagri).find(Boolean) || null, durum: g.durum || 'musait' });
      (g.kanallar || []).forEach((k) => kanalEkle(k, false));
    }
    const simdi = cagriSayilari();
    for (const [k, n] of simdi) {
      if (!oncekiCagrilar.get(k) && n && !(durum.cagri && durum.cagri.kanal === k)) {
        const baslatan = [...durum.cevrimici.values()].find((x) => x.cagri === k);
        bildir(`${kanalBasligi(k)}: görüşme başladı`, (baslatan ? baslatan.ad : '') + ' görüşmede · katılmak için tıkla', k);
      }
    }
    oncekiCagrilar = simdi;
    kisileriCiz(); kanallariCiz(); basligiCiz();
  });
  olaylariBagla(ch);
  ch.subscribe((s) => { if (s === 'SUBSCRIBED') lobiDurumuYay(); });
  durum.lobi = ch;
  // Kişisel kanal: birebir "yazıyor" (ve tablo yokken birebir mesajlar) buraya düşer.
  durum.kutu = sb.channel('ekip-kutu:' + durum.ben.id, { config: { private: OZEL } });
  olaylariBagla(durum.kutu);
  durum.kutu.subscribe();
  if (durum.tabloVar) {
    // Yeni satırlar RLS'e göre gelir: birebir mesajı yalnız iki taraf alır.
    sb.channel('ekip-mesaj-db')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ekip_mesaj' }, ({ new: m }) => mesajAl(m))
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'ekip_mesaj' }, ({ new: m }) => mesajGuncelAl(m))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ekip_tepki' }, ({ new: t }) => t && t.mesaj_id && tepkiAl(t))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ekip_okundu' }, ({ new: o }) => o && o.kanal && okunduAl(o))
      .subscribe();
  }
}

// Tablo varken kalıcı olaylar veritabanından gelir; anlık yayından gelenler yalnız yerel denemede işlenir
// (özel kanaldaki bir kullanıcı başkasının mesajını değiştirmiş gibi gösteremesin).
function olaylariBagla(ch) {
  ch.on('broadcast', { event: 'yaziyor' }, ({ payload }) => yaziyorAl(payload));
  if (durum.tabloVar) return;
  ch.on('broadcast', { event: 'mesaj' }, ({ payload }) => mesajAl(payload));
  ch.on('broadcast', { event: 'mesaj-guncel' }, ({ payload }) => mesajGuncelAl(payload));
  ch.on('broadcast', { event: 'mtepki' }, ({ payload }) => tepkiAl(payload));
  ch.on('broadcast', { event: 'okundu' }, ({ payload }) => okunduAl(payload));
}

// ---------- görüşme (WebRTC, herkes herkese) ----------
const cihazTercihi = () => { try { return JSON.parse(localStorage.getItem('ekip_cihaz') || '{}'); } catch (e) { return {}; } };
const SES_AYAR = { noiseSuppression: true, echoCancellation: true, autoGainControl: true }; // tarayıcının gürültü bastırması

async function yerelAkisAl() {
  const t = cihazTercihi();
  const ses = { ...SES_AYAR, ...(t.mik ? { deviceId: { ideal: t.mik } } : {}) };
  const goruntu = t.kam ? { deviceId: { ideal: t.kam } } : true;
  for (const k of [{ audio: ses, video: goruntu }, { audio: ses }, { video: goruntu }]) {
    try { return await navigator.mediaDevices.getUserMedia(k); } catch (e) { /* sıradaki seçenek */ }
  }
  return new MediaStream(); // cihaz/izin yoksa yalnız izleyici olarak katılır
}

function karoEkle(id, ad, akis, ben) {
  let k = karo(id);
  if (!k) {
    k = el('div', 'karo' + (ben ? ' ben' : '')); k.dataset.id = id;
    const v = el('video'); v.autoplay = true; v.playsInline = true;
    if (ben) v.muted = true; else hoparloruUygula(v);
    k.append(v, el('span', 'ad'));
    k.title = 'Tıkla: sabitle (büyük göster) · Çift tıkla: tam ekran';
    k.onclick = (e) => {
      if (e.target.closest('button')) return;
      const buyut = !k.classList.contains('buyuk');
      $('sahne').querySelectorAll('.karo.buyuk').forEach((x) => x.classList.remove('buyuk'));
      k.classList.toggle('buyuk', buyut);
    };
    k.ondblclick = () => { if (k.requestFullscreen) k.requestFullscreen().catch(() => {}); };
    if (!ben && durum.cagri && durum.cagri.erp) yonetimDugmeleri(k, id);
    $('sahne').append(k);
    if (durum.cagri) elIsaretle(id, durum.cagri.elSirasi.get(id));
  }
  k.querySelector('video').srcObject = akis;
  k.querySelector('span.ad').textContent = ad;
  return k;
}

const gonderilecekVideo = () => durum.cagri.ekran || (durum.cagri.arka && durum.cagri.arka.iz) || durum.cagri.yerel.getVideoTracks()[0] || null;
// Ekran sesi paylaşılırken mikrofonla karışık iz gider
const gonderilecekSes = () => durum.cagri.karisik || durum.cagri.yerel.getAudioTracks()[0] || null;

function esOlustur(id, ad) {
  const c = durum.cagri;
  const pc = new RTCPeerConnection({ iceServers: c.ice });
  const akis = new MediaStream();
  const es = { pc, ad, akis, bekleyenIce: c.bekleyenIce.get(id) || [] };
  c.bekleyenIce.delete(id);
  c.esler.set(id, es);
  pc.onicecandidate = (e) => { if (e.candidate) sinyalGonder(id, 'ice', e.candidate.toJSON()); };
  pc.ontrack = (e) => {
    akis.addTrack(e.track); karoEkle(id, ad, akis, false);
    if (e.track.kind === 'audio') analizEkle(id, e.track);
  };
  pc.onconnectionstatechange = () => {
    const etiket = karo(id)?.querySelector('span.ad');
    if (etiket) etiket.textContent = ad + (pc.connectionState === 'connected' ? '' : ' · ' + ({ new: 'bağlanıyor', connecting: 'bağlanıyor', disconnected: 'koptu', failed: 'bağlanamadı', closed: 'kapandı' }[pc.connectionState] || pc.connectionState));
    if (pc.connectionState === 'failed') pc.restartIce();
  };
  karoEkle(id, ad + ' · bağlanıyor', akis, false);
  return es;
}

function iziniAyarla(pc) {
  for (const tr of pc.getTransceivers()) {
    tr.direction = 'sendrecv';
    tr.sender.replaceTrack(tr.receiver.track.kind === 'video' ? gonderilecekVideo() : gonderilecekSes());
  }
}

async function teklifGonder(id, ad) {
  const es = esOlustur(id, ad);
  es.pc.addTransceiver('audio', { direction: 'sendrecv' });
  es.pc.addTransceiver('video', { direction: 'sendrecv' });
  iziniAyarla(es.pc);
  await es.pc.setLocalDescription(await es.pc.createOffer());
  sinyalGonder(id, 'offer', es.pc.localDescription.toJSON());
}

function sinyalGonder(kime, tur, veri) {
  durum.cagri.ch.send({ type: 'broadcast', event: 'rtc', payload: { kime, kimden: durum.ben.id, ad: durum.ben.ad, tur, veri } });
}

async function iceUygula(es) {
  for (const c of es.bekleyenIce.splice(0)) { try { await es.pc.addIceCandidate(c); } catch (e) { /* eski aday */ } }
}

async function sinyalAl(p) {
  const c = durum.cagri;
  if (!c || c.sfu || p.kime !== durum.ben.id) return; // sunucu üzerindeyken doğrudan bağlantı kurulmaz
  let es = c.esler.get(p.kimden);
  if (p.tur === 'ice') {
    if (es && es.pc.remoteDescription) { try { await es.pc.addIceCandidate(p.veri); } catch (e) { /* eski aday */ } }
    else if (es) es.bekleyenIce.push(p.veri);
    else { const l = c.bekleyenIce.get(p.kimden) || []; l.push(p.veri); c.bekleyenIce.set(p.kimden, l); }
    return;
  }
  if (p.tur === 'offer') {
    // Teklif, gönderenin presence bilgisi gelmeden ulaşabilir: kısa süre bekleyip yeniden değerlendir.
    const g = c.katilanlar.get(p.kimden);
    if (!g) { if ((p.deneme = (p.deneme || 0) + 1) < 5) setTimeout(() => sinyalAl(p), 700); return; }
    if (!izinli(p.kimden, g) || !izinli(durum.ben.id, { erp: c.erp })) return;
    if (es) esKapat(p.kimden); // yeniden katılım: eski bağlantıyı at
    es = esOlustur(p.kimden, p.ad);
    await es.pc.setRemoteDescription(p.veri);
    iziniAyarla(es.pc);
    await es.pc.setLocalDescription(await es.pc.createAnswer());
    sinyalGonder(p.kimden, 'answer', es.pc.localDescription.toJSON());
    await iceUygula(es);
  } else if (p.tur === 'answer' && es) {
    await es.pc.setRemoteDescription(p.veri);
    await iceUygula(es);
  }
}

function esKapat(id) {
  const es = durum.cagri.esler.get(id);
  if (es && es.pc) es.pc.close();
  durum.cagri.esler.delete(id);
  analizKaldir(id);
  karo(id)?.remove();
}

// ---------- bekleme salonu ve toplantı sahibi ----------
// ERP kullanıcıları görüşmede toplantı sahibidir. Misafir, bir sahip içeri alana kadar kimseyle bağlanmaz;
// sahiplerin kabul/çıkarma listeleri presence ile taşınır, böylece sonradan katılan sahip de bilir.
// ponytail: kontrol istemcide; misafir kanalı açık olduğundan teknik bilgisi olan biri presence'ını taklit edebilir.
// Gerçek zorlama gerekirse misafirlere Supabase anonim oturumu + özel kanal politikası eklenir.
function sahipListesi(kume) {
  const c = durum.cagri, s = new Set(c[kume]);
  for (const g of c.katilanlar.values()) if (g.erp) (g[kume] || []).forEach((x) => s.add(x));
  return s;
}
const cikarildi = (id) => sahipListesi('cikarilanlar').has(id);
function izinli(id, g) {
  if (cikarildi(id)) return false;
  return !!(g && g.erp) || sahipListesi('kabuller').has(id);
}

function eslesmeyiGuncelle() {
  const c = durum.cagri, onceki = c.katilanlar;
  c.katilanlar = new Map();
  for (const [id, g] of Object.entries(c.ch.presenceState())) if (id !== durum.ben.id) c.katilanlar.set(id, g[g.length - 1]);
  if (cikarildi(durum.ben.id)) return cikarildin();
  const benIzinli = izinli(durum.ben.id, { erp: c.erp });
  $('beklemeMesaji').hidden = benIzinli;
  $('beklemeMesaji').textContent = kilitli()
    ? '🔒 Toplantı kilitli. Toplantı sahibi kilidi açınca bekleme salonuna düşeceksin.'
    : '⏳ Toplantı sahibinin seni içeri almasını bekliyorsun. Sahip henüz katılmadıysa geldiğinde seni görecek.';
  for (const id of [...c.esler.keys()]) if (!benIzinli || !c.katilanlar.has(id) || !izinli(id, c.katilanlar.get(id))) esKapat(id);
  katilimiIsle(); elleriCiz();
  // Sonradan gelen teklif eder; eşitlikte küçük kimlik. Böylece iki taraf aynı anda teklif etmez.
  if (benIzinli && !c.sfu) for (const [id, g] of c.katilanlar) {
    const benSonra = c.katilma > g.katilma || (c.katilma === g.katilma && durum.ben.id < id);
    if (!c.esler.has(id) && benSonra && izinli(id, g)) teklifGonder(id, g.ad);
  }
  const izinliSayisi = [...c.katilanlar].filter(([id, g]) => izinli(id, g)).length + 1;
  if (benIzinli && !c.sfu && !c.sfuDenendi && (izinliSayisi >= KALABALIK || [...c.katilanlar.values()].some((g) => g.sfu))) sfuyaGec();
  if (c.sfu) sfuTara();
  // Açık anket/sorular içeri alınan her kişiye bir kez aktarılır (bekleme salonundakine gitmez).
  for (const id of onceki.keys()) if (!c.katilanlar.has(id)) c.aktarilan.delete(id);
  if (benIzinli) for (const [id, g] of c.katilanlar) if (izinli(id, g) && !c.aktarilan.has(id)) { c.aktarilan.add(id); durumAktar(id); }
  bekleyenleriCiz(); kayitSeridiCiz(); kisileriCizCagri(); izinleriUygula();
  if (!c.altyazi && [...c.katilanlar.values()].some((g) => g.altyazi)) altyaziAcKapa(true, false); // sonradan katılan da altyazıya girer
  if (!c.tahta && benIzinli && [...c.katilanlar.values()].some((g) => g.tahta)) tahtaAcKapa(true, false); // açık tahtayı görür
}

function bekleyenleriCiz() {
  const c = durum.cagri, kutu = $('bekleyenler');
  // Kilitliyken bekleyen misafir gösterilmez ve bildirim gelmez.
  const bekleyenler = c.erp && !kilitli() ? [...c.katilanlar].filter(([id, g]) => !izinli(id, g) && !cikarildi(id)) : [];
  kutu.hidden = !bekleyenler.length;
  kutu.replaceChildren(...bekleyenler.map(([id, g]) => {
    const satir = el('div', 'bekleyen'), al = el('button', 'ana', 'İçeri al'), red = el('button', null, 'Reddet');
    al.onclick = () => { c.kabuller.add(id); cagriDurumuYay(); eslesmeyiGuncelle(); };
    red.onclick = () => disariCikar(id);
    satir.append(el('span', null, `⏳ ${g.ad} görüşmeye girmek istiyor`), al, red);
    return satir;
  }));
  for (const [id, g] of bekleyenler) {
    if (c.bildirilen.has(id)) continue;
    c.bildirilen.add(id);
    bildir('Bekleme salonu', `${g.ad} görüşmeye girmek istiyor`, durum.aktif, true);
  }
}

function disariCikar(id) {
  const c = durum.cagri;
  c.kabuller.delete(id); c.cikarilanlar.add(id);
  cagriDurumuYay();
  komutGonder('cikar', id);
  esKapat(id);
  eslesmeyiGuncelle();
}

function komutGonder(tur, kime) {
  durum.cagri.ch.send({ type: 'broadcast', event: 'komut', payload: { tur, kime, kimden: durum.ben.id, ad: durum.ben.ad } });
}

function komutAl(p) {
  const c = durum.cagri, gonderen = c && c.katilanlar.get(p.kimden);
  if (!gonderen || !gonderen.erp) return; // yalnız toplantı sahiplerinin komutları
  if (p.kime !== durum.ben.id && p.kime !== '*') return;
  if (p.tur === 'sustur') {
    const mik = c.yerel.getAudioTracks()[0];
    if (mik && mik.enabled) { mik.enabled = false; mikKamDugmeleri(); tanimayiAyarla(); cagriDurumuYay(); }
    $('uyari').textContent = `${p.ad} mikrofonunu kapattı. Konuşmak için Mikrofon düğmesine bas.`;
    gSohbetEkle({ kimden: p.kimden, ad: 'ℹ️', metin: `${p.ad} mikrofonunu kapattı.` }, true);
  } else if (p.tur === 'el-indir') { if (c.el) elKaldir(); }
  else if (p.tur === 'bitir') gorusmedenCikti(`${p.ad} görüşmeyi herkes için bitirdi.`);
  else if (p.tur === 'cikar') cikarildin();
}

const cikarildin = () => gorusmedenCikti('Toplantı sahibi seni görüşmeden çıkardı.');
async function gorusmedenCikti(not) {
  await cagridanAyril();
  if (KONUK) { $('girisBaslik').textContent = not; $('girisDugme').hidden = true; } else $('uyari').textContent = not;
}

function yonetimDugmeleri(karo, id) {
  const y = el('div', 'yonetim'), sus = el('button', null, '🔇'), cik = el('button', 'tehlike', '⛔');
  sus.title = 'Mikrofonunu kapat'; sus.setAttribute('aria-label', 'Mikrofonunu kapat');
  cik.title = 'Görüşmeden çıkar'; cik.setAttribute('aria-label', 'Görüşmeden çıkar');
  sus.onclick = (e) => { e.stopPropagation(); komutGonder('sustur', id); };
  cik.onclick = (e) => { e.stopPropagation(); disariCikar(id); };
  y.append(sus, cik);
  karo.append(y);
}

// Misafir görüşmeleri ERP oturumu olmayanlar da katılabilsin diye açık kanalda; odayı tahmin edilemez bağlantı kodu korur.
// ayar: alt odaya geçerken önizleme atlanır; mikrofon/kamera durumu, ana kanal ve toplantı başlangıcı taşınır.
async function cagriyaKatil(kanal = durum.aktif, ayar = {}) {
  if (durum.cagri || durum.katiliyor) return;
  durum.katiliyor = true;
  const misafir = kanal.startsWith('misafir-');
  const iceSozu = iceAl(kanal); // önizleme sürerken TURN kimliği alınır
  let yerel, ice;
  try {
    yerel = await yerelAkisAl();
    if (!ayar.onizlemesiz && !(await onizlemeGoster(yerel))) { yerel.getTracks().forEach((t) => t.stop()); return; }
    ice = await iceSozu;
  } finally { durum.katiliyor = false; }
  if (ayar.mik === false && yerel.getAudioTracks()[0]) yerel.getAudioTracks()[0].enabled = false;
  if (ayar.kam === false && yerel.getVideoTracks()[0]) yerel.getVideoTracks()[0].enabled = false;
  const ch = sb.channel('ekip-cagri:' + kanal, { config: { presence: { key: durum.ben.id }, broadcast: { self: false }, private: OZEL && !misafir } });
  durum.cagri = { kanal, ch, yerel, ice, ekran: null, esler: new Map(), bekleyenIce: new Map(), katilma: Date.now(),
                  el: false, sesCtx: null, analizler: new Map(), konusma: new Map(), karisik: null, ekranSes: null, gOkunmamis: 0,
                  erp: !durum.ben.konuk, katilanlar: new Map(), kabuller: new Set(ayar.kabul || []), cikarilanlar: new Set(ayar.cikar || []), bildirilen: new Set(),
                  altyazi: false, altyazilar: new Map(), dokum: [], tanima: null,
                  tahta: false, tahtaVuruslar: new Map(), tahtaKutu: null, tahtaTuval: null,
                  baslangic: ayar.baslangic || Date.now(), anaKanal: ayar.ana || null, anaCh: null, altOda: ayar.altOda || null, altOdalar: ayar.altOdalar || null,
                  kilit: false, izinler: { sohbet: true, ekran: true, tepki: true }, elSirasi: new Map(), sohbetKaydi: [],
                  anketler: new Map(), sorular: new Map(), aktarilan: new Set(), sfu: null, sfuDenendi: false, duzen: localStorage.getItem('ekip_duzen') || 'oto', ceviri: '',
                  katilim: ayar.katilim || new Map([[durum.ben.id, { ad: durum.ben.ad, erp: !durum.ben.konuk, giris: new Date().toISOString(), cikis: null }]]) };
  const c = durum.cagri;
  // İçerik olayları yalnız içeri alınmışken işlenir: bekleme salonundaki misafir sohbeti, anketi, altyazıyı görmez.
  // Kişiye özel olaylar (rtc, komut, aktar, tahta-tum) kendi denetimini yapar.
  const icerik = (olay, fn) => ch.on('broadcast', { event: olay }, ({ payload }) => { if (izinli(durum.ben.id, { erp: c.erp })) fn(payload); });
  icerik('anket', (payload) => anketAl(payload));
  icerik('anket-oy', (payload) => oyAl(payload));
  icerik('anket-kapat', (payload) => { const a = c.anketler.get(payload.id); if (a && (a.sahip === payload.kimden || erpMi(payload.kimden))) anketKapat(a, false); });
  icerik('soru', (payload) => soruAl(payload));
  icerik('soru-oy', (payload) => soruOyuAl(payload));
  icerik('soru-cevap', (payload) => soruCevapAl(payload));
  ch.on('broadcast', { event: 'aktar' }, ({ payload }) => aktarAl(payload));
  icerik('alt-oda', (payload) => altOdaAl(payload));
  icerik('alt-oda-bitir', (payload) => { if (erpMi(payload.kimden)) { c.altOdalar = null; odaListesiCiz(); } });
  if (c.altOda) {
    // Alt odadayken ana kanal dinlenir: sahip odaları kapatınca ya da toplantıyı bitirince haber gelir.
    c.anaCh = sb.channel('ekip-cagri:' + c.anaKanal, { config: { broadcast: { self: false }, private: OZEL && !misafir } });
    c.anaCh.on('broadcast', { event: 'alt-oda-bitir' }, ({ payload }) => { if (c.altOda.sahipler.includes(payload.kimden)) altOdayaGec(0); });
    c.anaCh.on('broadcast', { event: 'komut' }, ({ payload }) => {
      if (payload.tur === 'bitir' && c.altOda.sahipler.includes(payload.kimden)) gorusmedenCikti(`${payload.ad} görüşmeyi herkes için bitirdi.`);
    });
    c.anaCh.subscribe();
    c.altOdaSayac = setTimeout(() => { if (durum.cagri === c) altOdayaGec(0); }, Math.max(0, c.altOda.bitis - Date.now()));
  }
  icerik('tahta', (payload) => tahtaVurusAl(payload));
  icerik('tahta-durum', (payload) => tahtaAcKapa(!!payload.acik, false));
  icerik('tahta-temizle', (payload) => tahtaTemizle());
  icerik('tahta-iste', (payload) => tahtaIstendi(payload));
  ch.on('broadcast', { event: 'tahta-tum' }, ({ payload }) => {
    if (payload.kime !== durum.ben.id || !Array.isArray(payload.vuruslar)) return;
    payload.vuruslar.forEach((v) => { if (!durum.cagri.tahtaVuruslar.has(v.id)) tahtaVurusAl({ v: v.id, r: v.r, k: v.k, p: v.p }); });
  });
  icerik('altyazi', (payload) => altyaziAl(payload));
  icerik('altyazi-durum', (payload) => altyaziAcKapa(!!payload.acik, false));
  ch.on('broadcast', { event: 'rtc' }, ({ payload }) => sinyalAl(payload).catch((e) => console.warn('sinyal', e)));
  // Misafirin sohbet/tepki izni sahip tarafından kapatılmışsa gelenler gösterilmez.
  icerik('tepki', (payload) => { if (gonderebilir(payload.kimden, 'tepki')) tepkiGoster(payload.kimden, payload.emoji); });
  icerik('gsohbet', (payload) => { if (gonderebilir(payload.kimden, 'sohbet')) gSohbetEkle(payload); });
  ch.on('broadcast', { event: 'komut' }, ({ payload }) => komutAl(payload));
  $('sahipMenu').hidden = !c.erp;
  $('anketForm').hidden = !c.erp;
  $('kayitDugme').hidden = !c.erp || !window.MediaRecorder;
  $('ozetDugme').hidden = $('ceviriSatiri').hidden = !c.erp || YEREL; // Claude yalnız ERP oturumuyla
  $('secCeviri').value = '';
  ['izinSohbet', 'izinEkran', 'izinTepki'].forEach((id) => { $(id).checked = true; });
  kilitDugmesi();
  $('secDuzen').value = c.duzen;
  $('kendimiGizle').checked = localStorage.getItem('ekip_kendimi_gizle') === '1';
  $('sahne').classList.toggle('kendimi-gizle', $('kendimiGizle').checked);
  $('beklemeMesaji').hidden = c.erp;
  $('altOdaBilgi').hidden = !c.altOda;
  ch.on('presence', { event: 'sync' }, eslesmeyiGuncelle);
  ch.subscribe((s) => { if (s === 'SUBSCRIBED') cagriDurumuYay(); });
  $('gorusme').classList.add('acik'); $('cagriCubugu').classList.add('acik');
  karoEkle(durum.ben.id, durum.ben.ad + ' (sen)', yerel, true);
  mikKamDugmeleri();
  if (yerel.getAudioTracks()[0]) analizEkle(durum.ben.id, yerel.getAudioTracks()[0]);
  c.olcer = setInterval(konusmayiOlc, 150);
  lobiDurumuYay(); basligiCiz();

const blobBase64 = (b) => new Promise((ok, hata) => {
  const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1] || ''); r.onerror = hata; r.readAsDataURL(b);
});

// Apps Script'e istek; ERP oturumu varsa doğrulama için eklenir (misafirde yok). sure: ms, takılırsa vazgeçilir.
